<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Order Studio</title>
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Order Studio">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F4F8F5">
  <link rel="apple-touch-icon" href="/order-studio-icon.png">
  <link rel="icon" type="image/png" href="/rose64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --forest: #4C6D5E; --forest-800: #2F473C; --sage-50: #F4F8F5; --sage-100: #EAF3EE; --line: #E4ECE7; --ink: #2C3832; --muted: #74827A; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif; background: var(--sage-50); color: var(--ink);
      display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 16px; text-align: center; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 32px 24px; max-width: 380px; width: 100%;
      box-shadow: 0 1px 2px rgba(47,71,60,.04), 0 6px 22px rgba(47,71,60,.06); }
    .icon { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 2px 10px rgba(47,71,60,.12); }
    h1 { font-family: "Amatic SC", cursive; font-size: 44px; color: var(--forest-800); margin: 14px 0 4px; line-height: 1; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 20px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; height: 48px; padding: 0 24px; border-radius: 14px;
      background: var(--forest); color: #fff; font-weight: 700; text-decoration: none; width: 100%; }
    .steps { text-align: left; background: var(--sage-50); border-radius: 14px; padding: 14px 16px; margin-top: 20px; font-size: 14px; }
    .steps strong { display: block; margin-bottom: 6px; color: var(--forest-800); }
    .steps ol { margin: 0; padding-left: 20px; }
    .steps li { margin: 4px 0; }
    .opening { display: none; }
    .standalone .opening { display: block; }
    .standalone .setup { display: none; }
  </style>
  <script>
    var APP_URL = 'https://script.google.com/macros/s/AKfycbwousFpijpxAXQR2GmUnlGjWEfNLayAnKVjJmJlI9u9hJsP-X_plMvq5-_MgBBUN12z/exec';
    // Opened from the home screen icon: go straight to the app
    var standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if (standalone) {
      document.documentElement.className = 'standalone';
      window.location.replace(APP_URL);
    }
  </script>
</head>
<body>
  <main class="card">
    <img class="icon" src="/order-studio-icon.png" alt="Crafty Rose">
    <h1>Order Studio</h1>
    <div class="opening"><p>Opening your studio…</p></div>
    <div class="setup">
      <p>Crafty Rose Gifts order and product manager.</p>
      <a class="btn" id="open" href="#">Open Order Studio</a>
      <div class="steps">
        <strong>Add it to your iPhone home screen</strong>
        <ol>
          <li>Open this page in <b>Safari</b>.</li>
          <li>Tap the <b>Share</b> button (square with an arrow).</li>
          <li>Tap <b>Add to Home Screen</b>, then <b>Add</b>.</li>
        </ol>
      </div>
    </div>
  </main>
  <script>document.getElementById('open').href = APP_URL;</script>
</body>
</html>
