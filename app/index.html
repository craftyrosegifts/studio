<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Order Studio</title>
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Order Studio">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2F473C">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  /* Brand (matches Social Studio) */
  --green: #8BC4A9;
  --green-500: #74B395;
  --forest: #4C6D5E;
  --forest-700: #3D5A4D;
  --forest-800: #2F473C;
  --white: #FFFFFF;
  --warm-white: #FFFDF9;
  --sage-25: #FAFCFA;
  --sage-50: #F4F8F5;
  --sage-100: #EAF3EE;
  --sage-150: #E0EDE5;
  --sage-200: #D3E5DA;
  --line: #E4ECE7;
  --ink: #2C3832;
  --ink-2: #4E5C55;
  --muted: #74827A;
  --muted-2: #9AA79F;
  /* Status */
  --st-gray-bg: #F0F2F1;   --st-gray: #5F6B65;
  --st-blue-bg: #E7F0F8;   --st-blue: #3F6B8F;
  --st-green-bg: #E4F2EA;  --st-green: #2F7A55;
  --st-purple-bg: #EEEBF8; --st-purple: #5D52A0;
  --st-red-bg: #FBEBEB;    --st-red: #A8464C;
  --st-amber-bg: #FFF4DF;  --st-amber: #94661A;

  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 22px;
  --shadow-sm: 0 1px 2px rgba(47, 71, 60, .05);
  --shadow: 0 1px 2px rgba(47, 71, 60, .04), 0 6px 22px rgba(47, 71, 60, .06);
  --shadow-lg: 0 12px 40px rgba(47, 71, 60, .14);
  --font-head: "Amatic SC", "Patrick Hand", cursive;
  --font: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --sidebar-w: 252px;
  --sidebar-w-collapsed: 78px;
  --topbar-h: 72px;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font); font-size: 14px; color: var(--ink);
  background: var(--sage-50); -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
a { color: var(--forest); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.ico { display: inline-flex; width: 20px; height: 20px; flex: none; }
.ico svg { width: 100%; height: 100%; }
.mobile-only { display: none !important; }

/* ---------- Layout ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-w); flex: none; background: var(--white);
  border-right: 1px solid var(--line); display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; transition: width .2s ease; z-index: 30;
}
.sidebar-brand { padding: 22px 20px 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.brand-full { max-width: 170px; height: auto; }
.brand-mark { display: none; width: 38px; height: 38px; }
.brand-sub {
  font-family: var(--font-head); font-size: 26px; color: var(--forest); line-height: 1; padding-left: 2px;
}
.nav { display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; flex: 1; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px;
  border-radius: 12px; border: 0; background: none; cursor: pointer; text-align: left;
  color: var(--ink-2); font-weight: 500; text-decoration: none; width: 100%;
}
.nav-item:hover { background: var(--sage-50); color: var(--ink); }
.nav-item.active { background: var(--sage-100); color: var(--forest-800); font-weight: 600; }
.nav-item.active .ico { color: var(--forest); }
.nav-item .badge { margin-left: auto; }
.sidebar-foot { padding: 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.collapse-btn {
  display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border: 0;
  background: none; color: var(--muted); border-radius: 12px; cursor: pointer;
}
.collapse-btn:hover { background: var(--sage-50); }
.app[data-sidebar="collapsed"] .sidebar { width: var(--sidebar-w-collapsed); }
.app[data-sidebar="collapsed"] .label,
.app[data-sidebar="collapsed"] .brand-full,
.app[data-sidebar="collapsed"] .brand-sub,
.app[data-sidebar="collapsed"] .nav-item .badge { display: none; }
.app[data-sidebar="collapsed"] .brand-mark { display: block; }
.app[data-sidebar="collapsed"] .sidebar-brand { align-items: center; padding: 20px 0 12px; }
.app[data-sidebar="collapsed"] .nav-item,
.app[data-sidebar="collapsed"] .collapse-btn { justify-content: center; padding: 0; }
.app[data-sidebar="collapsed"] .collapse-btn .ico { transform: scaleX(-1); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: var(--topbar-h); display: flex; align-items: center; gap: 16px; padding: 0 28px;
  background: rgba(244, 248, 245, .9); backdrop-filter: blur(8px);
  position: sticky; top: 0; z-index: 20; border-bottom: 1px solid transparent;
}
.topbar-title { min-width: 0; flex: 1; }
.topbar-title h1 {
  margin: 0; font-family: var(--font-head); font-size: 38px; line-height: 1; color: var(--forest-800); font-weight: 700;
}
.topbar-title p { margin: 2px 0 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-actions { display: flex; gap: 10px; align-items: center; }
.content { padding: 8px 28px 40px; flex: 1; min-width: 0; }
.scrim { display: none; }

/* ---------- Buttons & inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px;
  border-radius: 12px; border: 1px solid transparent; font-weight: 600; font-size: 14px;
  text-decoration: none; cursor: pointer; white-space: nowrap; background: var(--white);
}
.btn .ico { width: 18px; height: 18px; }
.btn-primary { background: var(--forest); color: var(--white); }
.btn-primary:hover { background: var(--forest-700); }
.btn-secondary { background: var(--white); border-color: var(--line); color: var(--ink); }
.btn-secondary:hover { background: var(--sage-25); border-color: var(--sage-200); }
.btn-ghost { background: none; color: var(--forest); }
.btn-ghost:hover { background: var(--sage-100); }
.btn-danger { background: none; color: var(--st-red); }
.btn-danger:hover { background: var(--st-red-bg); }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: .55; cursor: default; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 0; background: none; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); flex: none;
}
.icon-btn:hover { background: var(--sage-100); }
.icon-btn.sm { width: 32px; height: 32px; border-radius: 10px; }
.icon-btn.sm .ico { width: 16px; height: 16px; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; min-width: 0; }
.field > label, .label-sm { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.input, select.input, textarea.input {
  height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--white); outline: none; width: 100%; min-width: 0;
}
textarea.input { height: auto; min-height: 84px; padding: 10px 12px; resize: vertical; line-height: 1.5; }
.input:focus { border-color: var(--green-500); box-shadow: 0 0 0 3px rgba(139, 196, 169, .25); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; }
.check input { width: 18px; height: 18px; accent-color: var(--forest); }
.search {
  position: relative; display: flex; align-items: center;
}
.search .ico { position: absolute; left: 12px; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.search input { padding-left: 36px; width: 240px; }
.seg { display: inline-flex; background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.seg button {
  border: 0; background: none; height: 32px; padding: 0 12px; border-radius: 9px; cursor: pointer;
  color: var(--muted); font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
}
.seg button .ico { width: 16px; height: 16px; }
.seg button.on { background: var(--sage-100); color: var(--forest-800); }

/* ---------- Cards, chips ---------- */
.card { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-pad { padding: 20px; }
.card h3 { margin: 0 0 12px; font-size: 15px; font-weight: 700; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px;
  font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--st-gray-bg); color: var(--st-gray);
}
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.gray { background: var(--st-gray-bg); color: var(--st-gray); }
.chip.blue { background: var(--st-blue-bg); color: var(--st-blue); }
.chip.green { background: var(--st-green-bg); color: var(--st-green); }
.chip.purple { background: var(--st-purple-bg); color: var(--st-purple); }
.chip.red { background: var(--st-red-bg); color: var(--st-red); }
.chip.amber { background: var(--st-amber-bg); color: var(--st-amber); }
.tag { display: inline-flex; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--sage-100); color: var(--forest-700); font-size: 11px; font-weight: 600; align-items: center; }
.badge { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; background: var(--st-amber-bg); color: var(--st-amber); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.badge.red { background: var(--st-red-bg); color: var(--st-red); }

/* ---------- Toolbar ---------- */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 18px; }
.toolbar .spacer { flex: 1; }

/* ---------- Dashboard ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 20px; }
.kpi { padding: 18px 20px; }
.kpi .k-label { font-size: 12px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.kpi .k-label .ico { width: 16px; height: 16px; color: var(--forest); }
.kpi .k-val { font-size: 28px; font-weight: 700; margin-top: 8px; color: var(--forest-800); letter-spacing: -.5px; }
.kpi .k-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.dash-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
.dash-grid .stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.stage-bars { display: flex; flex-direction: column; gap: 12px; }
.stage-bar { display: grid; grid-template-columns: 130px 1fr 80px; gap: 12px; align-items: center; font-size: 13px; }
.stage-bar .track { height: 10px; background: var(--sage-100); border-radius: 999px; overflow: hidden; }
.stage-bar .fill { height: 100%; border-radius: 999px; background: var(--green-500); }
.stage-bar .num { text-align: right; font-weight: 600; }
.list { display: flex; flex-direction: column; }
.list-row {
  display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-top: 1px solid var(--line); cursor: pointer;
}
.list-row:first-child { border-top: 0; }
.list-row:hover { background: var(--sage-25); }
.list-row .grow { flex: 1; min-width: 0; }
.list-row .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-row .sub { font-size: 12px; color: var(--muted); }
.list-row .amt { font-weight: 700; white-space: nowrap; }

/* ---------- Board ---------- */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: 16px; overflow-x: auto; padding-bottom: 12px; align-items: start; }
.col { background: var(--sage-100); border-radius: var(--radius); padding: 10px; min-height: 200px; display: flex; flex-direction: column; gap: 10px; transition: background .15s; }
.col.drop { background: var(--sage-200); }
.col-head { display: flex; align-items: center; gap: 8px; padding: 4px 6px 2px; }
.col-head .name { font-weight: 700; }
.col-head .count { color: var(--muted); font-weight: 600; font-size: 12px; }
.col-head .sum { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--forest-700); }
.col-add { border: 1px dashed var(--sage-200); background: rgba(255,255,255,.5); border-radius: 12px; height: 38px; cursor: pointer; color: var(--forest); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
.col-add:hover { background: var(--white); }
.col-add .ico { width: 16px; height: 16px; }
.tile {
  background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 14px; cursor: pointer;
  box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 8px;
}
.tile:hover { border-color: var(--sage-200); box-shadow: var(--shadow); }
.tile.dragging { opacity: .5; }
.tile .t-top { display: flex; align-items: center; gap: 8px; }
.tile .t-num { font-size: 12px; font-weight: 700; color: var(--muted); }
.tile .t-amt { margin-left: auto; font-weight: 700; color: var(--forest-800); }
.tile .t-title { font-weight: 700; font-size: 15px; line-height: 1.3; }
.tile .t-sub { font-size: 12px; color: var(--muted); line-height: 1.4; }
.tile .t-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tile .t-photo { width: 100%; aspect-ratio: 16/10; border-radius: 10px; object-fit: cover; background: var(--sage-100); display: block; }
.tile .t-move { display: none; }

/* ---------- Table ---------- */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 12px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 14px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover { background: var(--sage-25); }
.tbl .num { text-align: right; white-space: nowrap; }
.tbl .strong { font-weight: 600; }

/* ---------- Grid of cards ---------- */
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.pcard { padding: 18px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; }
.pcard:hover { box-shadow: var(--shadow-lg); }
.pcard .p-name { font-weight: 700; font-size: 16px; }
.pcard .p-price { font-size: 22px; font-weight: 700; color: var(--forest-800); }
.pcard .p-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--sage-100); color: var(--forest); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: none; }

/* ---------- Drawer ---------- */
.drawer-scrim { position: fixed; inset: 0; background: rgba(44, 56, 50, .3); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; }
.drawer-scrim.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; height: 100%; width: min(640px, 100%); background: var(--warm-white);
  box-shadow: var(--shadow-lg); transform: translateX(100%); transition: transform .25s ease; z-index: 60;
  display: flex; flex-direction: column;
}
.drawer.open { transform: none; }
.drawer-head { display: flex; align-items: center; gap: 12px; padding: 18px 24px; border-bottom: 1px solid var(--line); }
.drawer-head h2 { margin: 0; flex: 1; font-family: var(--font-head); font-size: 34px; color: var(--forest-800); line-height: 1; }
.drawer-body { flex: 1; overflow-y: auto; padding: 20px 24px; }
.drawer-foot { padding: 14px 24px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; background: var(--white); }
.drawer-foot .spacer { flex: 1; }
.section-title { font-size: 13px; font-weight: 700; color: var(--forest-700); text-transform: uppercase; letter-spacing: .6px; margin: 22px 0 12px; display: flex; align-items: center; gap: 8px; }
.section-title:first-child { margin-top: 0; }

/* Line items */
.items { display: flex; flex-direction: column; gap: 10px; }
.item { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.item-main { display: grid; grid-template-columns: 1fr 70px 100px 32px; gap: 8px; align-items: end; }
.item-main .field { margin: 0; }
.item-total { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 13px; }
.item-total strong { font-size: 14px; }
.addons { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.addon { display: grid; grid-template-columns: 1fr 100px 32px; gap: 8px; }
.addon .input { height: 34px; font-size: 13px; }
.link-btn { border: 0; background: none; color: var(--forest); font-weight: 600; cursor: pointer; padding: 4px 0; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
.link-btn .ico { width: 14px; height: 14px; }
.summary { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.sum-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; gap: 12px; }
.sum-row .input { width: 110px; height: 34px; text-align: right; }
.sum-row.total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; font-size: 18px; font-weight: 700; color: var(--forest-800); }
.sum-row.profit { font-size: 13px; color: var(--muted); }
.money-in { position: relative; }
.money-in::before { content: "$"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }
.money-in .input { padding-left: 22px; }
.sum-row .money-in .input { padding-left: 22px; }

/* Photos & links */
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.photo { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--sage-100); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .icon-btn { position: absolute; top: 4px; right: 4px; background: rgba(255,255,255,.9); }
.photo-add { aspect-ratio: 1; border: 1px dashed var(--sage-200); border-radius: 12px; display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: center; color: var(--forest); font-weight: 600; font-size: 12px; cursor: pointer; background: var(--white); }
.photo-add:hover { background: var(--sage-25); }
.links { display: flex; flex-direction: column; gap: 8px; }
.link-row { display: flex; gap: 8px; align-items: center; }
.link-row a { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Empty, toast, loading */
.empty { text-align: center; padding: 48px 20px; color: var(--muted); }
.empty img { width: 56px; opacity: .85; }
.empty h3 { font-family: var(--font-head); font-size: 30px; color: var(--forest); margin: 10px 0 4px; }
.empty p { margin: 0 0 16px; }
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); background: var(--forest-800); color: var(--white);
  padding: 12px 18px; border-radius: 12px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .2s; z-index: 80; box-shadow: var(--shadow-lg);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: var(--st-red); }
.loading { position: fixed; inset: 0; background: var(--sage-50); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: var(--forest); font-weight: 600; transition: opacity .3s; }
.loading img { width: 64px; animation: pulse 1.4s ease-in-out infinite; }
.loading.hide { opacity: 0; pointer-events: none; }
@keyframes pulse { 50% { transform: scale(.9); opacity: .7; } }

.due-over { color: var(--st-red); font-weight: 600; }
.due-soon { color: var(--st-amber); font-weight: 600; }
.hint { font-size: 12px; color: var(--muted); margin: -6px 0 14px; }
.margin-good { color: var(--st-green); font-weight: 600; }
.margin-low { color: var(--st-amber); font-weight: 600; }

/* ---------- Responsive ---------- */
@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dash-grid { grid-template-columns: 1fr; }
}
@media (max-width: 820px) {
  .mobile-only { display: inline-flex !important; }
  .desktop-only { display: none !important; }
  .sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); transition: transform .25s ease; box-shadow: var(--shadow-lg); width: 270px !important; }
  .app.nav-open .sidebar { transform: none; }
  .app.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(44,56,50,.3); z-index: 25; }
  .app .sidebar .label, .app .sidebar .brand-full, .app .sidebar .brand-sub { display: initial !important; }
  .app .sidebar .brand-mark { display: none !important; }
  .collapse-btn { display: none; }

  var sold = {};

      '<div class="card card-pad"><h3>Coming up</h3>' + (upcoming.length ? '<div class="list">' + upcoming.map(orderRow).join('') + '</div>' : '<p class="muted">No open orders with due dates.</p>') + '</div>' +
      '<div class="card card-pad"><h3>Newest orders</h3>' + (recent.length ? '<div class="list">' + recent.map(orderRow).join('') + '</div>' : '<p class="muted">No orders yet.</p>') + '</div>' +
    '</div><div class="stack">' +

        return '<div class="list-row" style="cursor:default"><div class="grow"><div class="title">' + esc(t.name) + '</div><div class="sub">' + t.qty + ' sold</div></div><div class="amt">' + money(t.val) + '</div></div>';
      }).join('') + '</div>' : '<p class="muted">Sales will show here once orders are confirmed.</p>') + '</div>' +
      '<div class="card card-pad"><h3>Product ideas</h3><div class="list">' + ideaCounts + '</div></div>' +
    '</div></div>';
}

function orderBoard(list) {

function orderTable(list) {

function moveOrder(id, stage) {

  var prev = o.stage;
  o.stage = stage;
  render();
  save('Orders', o).then(function () { toast(o.number + ' moved to ' + stage); renderNav(); })
    .catch(function (e) { o.stage = prev; render(); fail(e); });

/* Drag and drop for boards */
function bindBoardDnD() {
  var board = $('.board');
  if (!board) return;
  var table = board.getAttribute('data-board');
  $$('.tile', board).forEach(function (t) {
    t.addEventListener('dragstart', function (e) {
      t.classList.add('dragging');
      e.dataTransfer.setData('text/plain', t.getAttribute('data-order') || t.getAttribute('data-idea') || t.getAttribute('data-item'));
    });
    t.addEventListener('dragend', function () { t.classList.remove('dragging'); });
  });
  $$('.col', board).forEach(function (c) {
    c.addEventListener('dragover', function (e) { e.preventDefault(); c.classList.add('drop'); });
    c.addEventListener('dragleave', function () { c.classList.remove('drop'); });
    c.addEventListener('drop', function (e) {
      e.preventDefault(); c.classList.remove('drop');
      var id = e.dataTransfer.getData('text/plain');
      var stage = c.getAttribute('data-stage');
      if (table === 'Orders') moveOrder(id, stage); else if (table === 'Ideas') moveIdea(id, stage); else moveItem(id, stage);
    });
  });
}

function bindOrderForm() {

    if (isNew) $('#ncName').focus();
  });
  bindCustomerPicker();
  $('#addProduct').addEventListener('change', function (e) {
    var p = byId('Products', e.target.value);
    if (p) D.items.push({ productId: p.id, name: p.name, qty: 1, unitPrice: num(p.price), unitCost: productCost(p), addons: [] });
    e.target.value = '';

  });

  });
  body.addEventListener('input', function (e) {

    if (t.id === 'oDiscount') { D.discount = num(t.value); renderSummary(); return; }
    if (!itemEl) return;
    var it = D.items[+itemEl.getAttribute('data-i')];
    if (t.hasAttribute('data-f')) {
      var f = t.getAttribute('data-f');
      it[f] = f === 'name' ? t.value : num(t.value);
    } else if (t.hasAttribute('data-a')) {
      var a = it.addons[+t.closest('.addon').getAttribute('data-j')];
      a[t.getAttribute('data-a')] = t.getAttribute('data-a') === 'price' ? num(t.value) : t.value;
    }
    $('.line-total', itemEl).textContent = money(itemTotal(it));

  });
  body.addEventListener('click', function (e) {

    else if (e.target.closest('[data-add-addon]')) {
      D.items[i].addons = D.items[i].addons || [];
      D.items[i].addons.push({ label: '', price: '' });
      renderItems();
      var el = $$('.item')[i]; var ins = $$('[data-a="label"]', el); ins[ins.length - 1].focus();
    } else if (e.target.closest('[data-del-addon]')) {
      D.items[i].addons.splice(+e.target.closest('.addon').getAttribute('data-j'), 1); renderItems();
    }
  });
  renderItems();
  $('#dSave').addEventListener('click', function () { saveOrder(); });

    if (!confirm('Move order ' + D.number + ' to Trash?' + (D.stockUsed && Object.keys(D.stockUsed).length ? ' The materials it took go back into stock.' : '') + ' You can restore it from Trash for 30 days.')) return;
    busy(del, 'Deleting…');
    remove('Orders', D.id).then(function () { closeDrawer(); render(); }).catch(function (e) { unbusy(del); fail(e); });   // Phase 2 Step 2A-5: Trash, with Undo
  });
}
function saveOrder(after) {
  var btn = $('#dSave');
  D.stage = $('#oStage').value;
  D.dueDate = $('#oDue').value;
  D.delivery = $('#oDelivery').value;
  D.tracking = D.delivery === 'Shipping' ? $('#oTracking').value.trim() : '';
  D.paid = $('#oPaid').checked;
  if (D.paid && $('#oDatePaid')) D.datePaid = $('#oDatePaid').value;                       // Phase 2 Step 2A-3
  if (D.stage === DONE && $('#oDateDone')) D.dateCompleted = $('#oDateDone').value;
  D.paymentLink = $('#oPayLink').value.trim();
  if (D.paymentLink && !/^https?:\/\//i.test(D.paymentLink)) D.paymentLink = 'https://' + D.paymentLink;
  D.notes = $('#oNotes').value;
  D.items = D.items.filter(function (it) { return it.name || num(it.unitPrice); });
  D.items.forEach(function (it) { it.addons = (it.addons || []).filter(function (a) { return a.label || num(a.price); }); });
  var c = calcOrder(D);
  D.subtotal = c.subtotal; D.total = c.total; D.cost = c.cost; D.profit = c.profit;
  var custSel = $('#oCustomer').value;
  busy(btn, 'Saving…');
  var step = Promise.resolve();
  if (custSel === '__new') {
    var name = $('#ncName').value.trim();
    if (!name) { unbusy(btn); toast('Please enter the new customer\'s name.', true); $('#ncName').focus(); return; }
    step = save('Customers', { name: name, phone: $('#ncPhone').value.trim(), email: $('#ncEmail').value.trim() })
      .then(function (cu) { D.customerId = cu.id; D.customerName = cu.name; });
  } else {
    D.customerId = custSel;
    var cu = byId('Customers', custSel);

/* Resize photos in the browser before uploading (max 1600px, JPEG) */
function shrinkImage(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onerror = function () { reject(new Error('Could not read ' + file.name)); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { reject(new Error(file.name + ' is not an image this browser can open.')); };
      img.onload = function () {
        var max = 1600, w = img.width, h = img.height;
        if (w > max || h > max) { var r = Math.min(max / w, max / h); w = Math.round(w * r); h = Math.round(h * r); }
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        var dataUrl = c.toDataURL('image/jpeg', 0.85);
        resolve({ mime: 'image/jpeg', base64: dataUrl.split(',')[1], dataUrl: dataUrl });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function loadPhotos() {
  $$('img[data-photo]').forEach(function (img) {
    var id = img.getAttribute('data-photo');
    if (S.photoCache[id]) { img.src = S.photoCache[id]; return; }
    if (S.photoCache[id] === false) return;
    S.photoCache[id] = false;
    call('getPhoto', id).then(function (url) {
      S.photoCache[id] = url;
      $$('img[data-photo="' + id + '"]').forEach(function (el) { el.src = url; });
    }).catch(function () { delete S.photoCache[id]; });
  });
}

/* ---------------- Trash (Phase 2 Step 2A-4) ----------------
   Deleting a customer, product, material, expense, supplier, list or list item moves it here for 30 days.
   Restore puts it back exactly as it was; "Delete forever" removes it (and its photos/receipts) for good. */
var TRASHABLE = { Orders: 1, Customers: 1, Products: 1, Materials: 1, Expenses: 1, Suppliers: 1, Lists: 1, ListItems: 1 };   // Orders: Phase 2 Step 2A-5
var TRASH_TYPES = { Orders: 'Order', Customers: 'Customer', Products: 'Product', Materials: 'Material', Expenses: 'Expense', Suppliers: 'Supplier', Lists: 'List', ListItems: 'List item' };
function trashLabel(t, r) {
  if (t === 'Orders') return (r.number || 'Order') + ' · ' + (r.customerName || 'No customer') + ' · ' + money(r.total);
  if (t === 'Expenses') return (r.vendor || 'Expense') + ' · ' + money(r.amount) + (r.date ? ' · ' + niceDate(r.date) : '');
  if (t === 'ListItems') { var l = byId('Lists', r.listId); return (r.title || 'Untitled') + (l ? ' (' + l.name + ')' : ''); }
  return r.name || r.title || 'Untitled';
}
function trashSub(t, r) {
  if (t === 'Orders') return [r.stage, r.paid ? 'paid' : 'unpaid', trashOrderStock(r) ? 'stock was returned' : ''].filter(Boolean).join(' · ');
  if (t === 'Customers') { var n = S.data.Orders.filter(function (o) { return o.customerId === r.id; }).length; return [r.email, r.phone, n ? n + ' order(s) still linked' : ''].filter(Boolean).join(' · '); }
  if (t === 'Products') return [r.category, money(r.price)].filter(Boolean).join(' · ');
  if (t === 'Lists') { var e = (S.trash || []).filter(function (x) { return x.table === 'Lists' && x.record.id === r.id; })[0]; var k = e ? e.items : 0; return k ? k + ' item(s) went with it' : ''; }
  return '';
}
function trashOrderStock(r) { return (r.log || []).some(function (l) { return l && l.stockReturned && Object.keys(l.stockReturned).length && Math.abs(new Date(l.trashedAt).getTime() - new Date(String(r.deleted).slice(0, 24)).getTime()) < 1000; }); }
function trashGoneDay(iso) { var d = new Date(String(iso).slice(0, 24)); d.setDate(d.getDate() + 30); return d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' }); }
function renderTrash() {
  var items = S.trash || [];
  if (!items.length) return emptyState('Trash is empty', 'Deleted orders, customers, products, materials, expenses, suppliers and lists are kept here for 30 days so you can restore them.');
  return '<p class="muted" style="margin:0 0 12px">Items stay here for 30 days, then they are removed for good. Your daily backups keep older copies.</p>' +
    '<div class="card">' + items.map(function (it) {
      var key = esc(it.table + '|' + it.record.id);
      return '<div class="list-row trash-row"><div class="grow"><div class="title">' + esc(trashLabel(it.table, it.record)) + '</div>' +
        '<div class="sub">' + esc(TRASH_TYPES[it.table] || it.table) + ' · deleted ' + esc(niceDate(String(it.deleted).slice(0, 10))) + ' · removed for good ' + esc(trashGoneDay(it.deleted)) +
        (trashSub(it.table, it.record) ? ' · ' + esc(trashSub(it.table, it.record)) : '') + '</div></div>' +
        '<button class="btn btn-secondary btn-sm" type="button" data-trash-restore="' + key + '">Restore</button>' +
        '<button class="btn btn-ghost btn-sm trash-forever" type="button" data-trash-forever="' + key + '">Delete forever</button></div>';
    }).join('') + '</div>';
}
function moveToTrash(table, id) {
  return call('trashRecord', table, id).then(function (res) {
    S.data[table] = S.data[table].filter(function (r) { return r.id !== id; });
    if (table === 'Lists') S.data.ListItems = S.data.ListItems.filter(function (x) { return x.listId !== id; });
    S.trash = (S.trash || []).filter(function (x) { return !(x.table === table && x.record.id === id); });
    S.trash.unshift({ table: table, deleted: res.deleted, record: res.record, items: (res.items || []).length });
    renderNav();
    if (table === 'Orders' && typeof afterOrderSaved === 'function') afterOrderSaved();   // stock may have changed
    var back = res.stock && res.stock.returned ? Object.keys(res.stock.returned).length : 0;
    toastUndo((TRASH_TYPES[table] || 'Item') + ' moved to Trash' + (back ? ' · stock returned' : ''), function () { restoreFromTrash(table, id); });
    return res;
  });
}
function restoreFromTrash(table, id) {
  return call('restoreRecord', table, id).then(function (res) {
    var list = S.data[table]; if (!list.some(function (r) { return r.id === id; })) list.push(res.record);
    (res.items || []).forEach(function (it) { if (!S.data.ListItems.some(function (x) { return x.id === it.id; })) S.data.ListItems.push(it); });
    S.trash = (S.trash || []).filter(function (x) { return !(x.table === table && x.record.id === id); });
    var st = res.stock || {}, taken = st.taken ? Object.keys(st.taken).length : 0;
    if (table === 'Orders' && typeof afterOrderSaved === 'function') afterOrderSaved();   // stock may have changed
    render(); toast((TRASH_TYPES[table] || 'Item') + ' restored' + (taken ? ' · stock taken out again' : ''));
    var warn = [];
    if (st.missing && st.missing.length) warn.push('These materials no longer exist, so their stock was not taken out: ' + st.missing.join(', ') + '.');
    if (st.below && st.below.length) warn.push('Stock is now below zero for: ' + st.below.join(', ') + '.');
    if (warn.length) alert((TRASH_TYPES[table] || 'Item') + ' restored.\n\n' + warn.join('\n\n'));
  }).catch(fail);
}
function deleteForeverFromTrash(table, id) {
  var it = (S.trash || []).filter(function (x) { return x.table === table && x.record.id === id; })[0];
  if (!confirm('Delete "' + (it ? trashLabel(table, it.record) : 'this item') + '" for good? This can\'t be undone (only your daily backups will still have it). Its photos/receipts go to your Google Drive trash, unless another record also uses them.')) return;
  call('deleteForever', table, id).then(function (res) {
    S.trash = (S.trash || []).filter(function (x) { return !(x.table === table && x.record.id === id); });
    var k = res && res.kept ? res.kept.length : 0;
    render(); toast('Deleted for good' + (k ? ' · ' + k + ' file(s) kept in Google Drive because another record uses them' : ''));
  }).catch(fail);
}
function toastUndo(msg, undo) {
  var t = $('#toast');
  t.innerHTML = esc(msg) + ' <button type="button" class="toast-undo">Undo</button>';
  t.className = 'toast show undo';
  var b = t.querySelector('.toast-undo');
  b.addEventListener('click', function () { t.className = 'toast'; undo(); }, { once: true });
  clearTimeout(toast._t);

}
document.addEventListener('DOMContentLoaded', function () {   // added last, so Trash sits at the end of the menu
  if (!VIEWS.some(function (v) { return v.key === 'trash'; })) VIEWS.push({ key: 'trash', label: 'Trash', icon: 'trash', sub: 'Deleted items are kept here for 30 days' });

document.addEventListener('click', function (e) {
  var r = e.target.closest('[data-trash-restore]'), f = e.target.closest('[data-trash-forever]');

function bindCustomerPicker() {

    }));

        '<span>' + esc(it.label) + '</span>' + (it.sub ? '<span class="muted small">' + esc(it.sub) + '</span>' : '') + '</div>';
    }).join('') + (hits.length > 50 ? '<div class="muted small cust-more">Keep typing to narrow down ' + hits.length + ' customers…</div>' : '') +
      (q && !hits.length ? '<div class="muted small cust-more">No customer matches "' + esc(inp.value.trim()) + '"</div>' : '');
    list.hidden = false;

  var pick = function (id) {

   Business tools: pricing helper, stock alerts, shipping helper,

   ================================================================ */

/* ---------------- Pricing helper ---------------- */
function pricingSettings() {
  var s = S.settings || {};
  return { rate: num(s.hourlyRate === undefined ? 20 : s.hourlyRate), markup: num(s.markupPct === undefined ? 30 : s.markupPct),
    feePct: num(s.feePct === undefined ? 2.9 : s.feePct), feeFixed: num(s.feeFixed === undefined ? 0.30 : s.feeFixed), round: s.roundPrices !== false };
}
function suggestPrice(materials, minutes) {
  var ps = pricingSettings();
  var labor = num(minutes) / 60 * ps.rate;
  var base = num(materials) + labor;
  var profit = base * ps.markup / 100;
  var beforeFees = base + profit;
  var exact = ps.feePct < 100 ? (beforeFees + ps.feeFixed) / (1 - ps.feePct / 100) : beforeFees;
  var fees = exact - beforeFees;
  var rounded = exact;
  if (ps.round && exact >= 1) rounded = Math.ceil(exact) - 0.01;

function itemVariantMats(it) {
  var p = it.productId && byId('Products', it.productId);

    .filter(function (m) { if (!m || !variantsOf(m).length || seen[m.id]) return false; seen[m.id] = 1; return true; });

function itemCostWithVariants(it) {
  var p = byId('Products', it.productId); if (!p) return num(it.unitCost);

    var m = byId('Materials', x.materialId); if (!m) return s;
    var vid = it.variants && it.variants[m.id];

  }, 0));
}

function greetingHtml() {

function sixMonthChart() {

  if (!scrim) {
    scrim = document.createElement('div'); scrim.className = 'sh-scrim'; scrim.id = 'shScrim'; document.body.appendChild(scrim);
    box = document.createElement('div'); box.className = 'sh'; box.id = 'shBox'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', 'Share your order form'); document.body.appendChild(box);
    scrim.addEventListener('click', closeShareForm);
    box.addEventListener('click', function (e) {
      if (e.target.closest('[data-shclose]')) { closeShareForm(); return; }
      if (e.target.closest('#shCopy')) { copyText(FORM_URL, 'Order form link copied'); return; }
      if (e.target.closest('#shCopyMsg')) { copyText(currentMsg() + '\n' + FORM_URL, 'Message and link copied'); return; }
      if (e.target.closest('#shNative')) {
        navigator.share({ title: 'Crafty Rose Gifts order form', text: currentMsg(), url: FORM_URL }).catch(function () {});
        return;
      }
      if (e.target.closest('#shReset')) { $('#shMsg').value = SHARE_MSG_DEFAULT; saveMsg(); refreshLinks(); }
    });
    box.addEventListener('input', function (e) { if (e.target.id === 'shMsg') { saveMsg(); refreshLinks(); } });
  }
  var qr = qrDataUrl(url);
  var canShare = !!navigator.share;
  box.innerHTML = '<div class="sh-head"><h3>Share your order form</h3><button class="icon-btn" type="button" data-shclose aria-label="Close">' + icon('x') + '</button></div>' +
    '<div class="sh-link"><span>' + esc(url.replace('https://', '')) + '</span><button class="btn btn-primary btn-sm" type="button" id="shCopy">' + ico('link') + 'Copy link</button></div>' +
    '<div class="sh-grid">' +
      (canShare ? '<button class="sh-opt" type="button" id="shNative"><b>📤</b>Share…</button>' : '') +
      '<a class="sh-opt" id="shSms" target="_top"><b>💬</b>Text message</a>' +
      '<a class="sh-opt" id="shMail" target="_top"><b>✉️</b>Email</a>' +
      '<a class="sh-opt" id="shFb" target="_blank" rel="noopener"><b>📘</b>Facebook post</a>' +
      (isPhone() ? '<a class="sh-opt" id="shMsgr" target="_top"><b>💭</b>Messenger</a>' : '') +
      '<button class="sh-opt" type="button" id="shCopyMsg"><b>📋</b>Copy message</button>' +
    '</div>' +
    '<div class="sh-label">Message that goes with the link</div>' +
    '<textarea class="input sh-msg" id="shMsg">' + esc(msg) + '</textarea>' +
    '<div style="text-align:right;margin-top:4px"><button class="link-btn" type="button" id="shReset">Reset message</button></div>' +
    '<p class="hint" style="margin:6px 0 0">For Instagram, tap <b>Copy link</b> and paste it into your bio, a story link sticker, or a DM.</p>' +
    (qr ? '<div class="sh-label">QR code for craft fairs & packaging</div><div class="sh-qr"><img src="' + qr + '" alt="QR code for your order form" id="shQrImg"><div>' +
      '<p>Customers point their phone camera at it to open your order form. Print it for your table, cards or packaging.</p>' +
      '<a class="btn btn-secondary btn-sm" download="crafty-rose-order-form-qr.png" href="' + qr + '" target="_blank">Save QR code</a>' +
      (isPhone() ? '<p class="hint" style="margin:8px 0 0">Or press and hold the code to save it to Photos.</p>' : '') + '</div></div>' : '') +
    '<div class="sh-done"><button class="btn btn-primary" type="button" data-shclose>Done</button></div>';
  refreshLinks();
  scrim.classList.add('on'); box.classList.add('on');
  var app = document.getElementById('app'); if (app) app.classList.remove('nav-open');
}
function currentMsg() { var m = document.getElementById('shMsg'); return (m && m.value.trim()) || SHARE_MSG_DEFAULT; }
function saveMsg() { try { localStorage.setItem('os.shareMsg', currentMsg()); } catch (e) {} }
function refreshLinks() {
  var m = currentMsg(), u = FORM_URL, full = m + '\n' + u;
  var set = function (id, href) { var a = document.getElementById(id); if (a) a.href = href; };
  set('shSms', 'sms:' + (/iPhone|iPad/.test(navigator.userAgent) ? '&' : '?') + 'body=' + encodeURIComponent(full));
  set('shMail', 'mailto:?subject=' + encodeURIComponent('Order a custom gift from Crafty Rose Gifts') + '&body=' + encodeURIComponent(full));
  set('shFb', 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(u));
  set('shMsgr', 'fb-messenger://share/?link=' + encodeURIComponent(u));
}
function closeShareForm() { var s = document.getElementById('shScrim'), b = document.getElementById('shBox'); if (s) s.classList.remove('on'); if (b) b.classList.remove('on'); }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeShareForm(); });

/* Buttons: in the side menu, on the dashboard, and in Invoice settings */
document.addEventListener('DOMContentLoaded', function () {
  var foot = document.querySelector('.sidebar-foot');
  if (foot) {
    var b = document.createElement('button');
    b.className = 'nav-item share-btn'; b.type = 'button'; b.id = 'shareFormBtn';
    b.innerHTML = '<span class="ico">' + icon('share') + '</span><span class="label">Share order form</span>';
    foot.insertBefore(b, foot.firstChild);
    b.addEventListener('click', openShareForm);
  }
});
var _greetingShare = greetingHtml;
greetingHtml = function () {
  return _greetingShare().replace('</p>', '</p><div class="quick" style="margin-top:12px"><button class="btn btn-secondary btn-sm" type="button" data-act-share>' + ico('share') + 'Share my order form</button></div>');
};
document.addEventListener('click', function (e) { if (e.target.closest('[data-act-share]')) openShareForm(); });
var _openInvoiceSettingsS = openInvoiceSettings;
openInvoiceSettings = function (backToOrder) {
  _openInvoiceSettingsS(backToOrder);
  var copy = document.getElementById('foCopy');
  if (copy) copy.insertAdjacentHTML('afterend', '<button class="btn btn-secondary btn-sm" type="button" data-act-share>' + ico('share') + 'Share…</button>');
};
</script>
