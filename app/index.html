<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Order Studio</title>
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Order Studio">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2F473C">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  /* Brand (matches Social Studio) */
  --green: #8BC4A9;
  --green-500: #74B395;
  --forest: #4C6D5E;
  --forest-700: #3D5A4D;
  --forest-800: #2F473C;
  --white: #FFFFFF;
  --warm-white: #FFFDF9;
  --sage-25: #FAFCFA;
  --sage-50: #F4F8F5;
  --sage-100: #EAF3EE;
  --sage-150: #E0EDE5;
  --sage-200: #D3E5DA;
  --line: #E4ECE7;
  --ink: #2C3832;
  --ink-2: #4E5C55;
  --muted: #74827A;
  --muted-2: #9AA79F;
  /* Status */
  --st-gray-bg: #F0F2F1;   --st-gray: #5F6B65;
  --st-blue-bg: #E7F0F8;   --st-blue: #3F6B8F;
  --st-green-bg: #E4F2EA;  --st-green: #2F7A55;
  --st-purple-bg: #EEEBF8; --st-purple: #5D52A0;
  --st-red-bg: #FBEBEB;    --st-red: #A8464C;
  --st-amber-bg: #FFF4DF;  --st-amber: #94661A;

  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 22px;
  --shadow-sm: 0 1px 2px rgba(47, 71, 60, .05);
  --shadow: 0 1px 2px rgba(47, 71, 60, .04), 0 6px 22px rgba(47, 71, 60, .06);
  --shadow-lg: 0 12px 40px rgba(47, 71, 60, .14);
  --font-head: "Amatic SC", "Patrick Hand", cursive;
  --font: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --sidebar-w: 252px;
  --sidebar-w-collapsed: 78px;
  --topbar-h: 72px;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font); font-size: 14px; color: var(--ink);
  background: var(--sage-50); -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
a { color: var(--forest); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.ico { display: inline-flex; width: 20px; height: 20px; flex: none; }
.ico svg { width: 100%; height: 100%; }
.mobile-only { display: none !important; }

/* ---------- Layout ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-w); flex: none; background: var(--white);
  border-right: 1px solid var(--line); display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; transition: width .2s ease; z-index: 30;
}
.sidebar-brand { padding: 22px 20px 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.brand-full { max-width: 170px; height: auto; }
.brand-mark { display: none; width: 38px; height: 38px; }
.brand-sub {
  font-family: var(--font-head); font-size: 26px; color: var(--forest); line-height: 1; padding-left: 2px;
}
.nav { display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; flex: 1; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px;
  border-radius: 12px; border: 0; background: none; cursor: pointer; text-align: left;
  color: var(--ink-2); font-weight: 500; text-decoration: none; width: 100%;
}
.nav-item:hover { background: var(--sage-50); color: var(--ink); }
.nav-item.active { background: var(--sage-100); color: var(--forest-800); font-weight: 600; }
.nav-item.active .ico { color: var(--forest); }
.nav-item .badge { margin-left: auto; }
.sidebar-foot { padding: 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.collapse-btn {
  display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border: 0;
  background: none; color: var(--muted); border-radius: 12px; cursor: pointer;
}
.collapse-btn:hover { background: var(--sage-50); }
.app[data-sidebar="collapsed"] .sidebar { width: var(--sidebar-w-collapsed); }
.app[data-sidebar="collapsed"] .label,
.app[data-sidebar="collapsed"] .brand-full,
.app[data-sidebar="collapsed"] .brand-sub,
.app[data-sidebar="collapsed"] .nav-item .badge { display: none; }
.app[data-sidebar="collapsed"] .brand-mark { display: block; }
.app[data-sidebar="collapsed"] .sidebar-brand { align-items: center; padding: 20px 0 12px; }
.app[data-sidebar="collapsed"] .nav-item,
.app[data-sidebar="collapsed"] .collapse-btn { justify-content: center; padding: 0; }
.app[data-sidebar="collapsed"] .collapse-btn .ico { transform: scaleX(-1); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: var(--topbar-h); display: flex; align-items: center; gap: 16px; padding: 0 28px;
  background: rgba(244, 248, 245, .9); backdrop-filter: blur(8px);
  position: sticky; top: 0; z-index: 20; border-bottom: 1px solid transparent;
}
.topbar-title { min-width: 0; flex: 1; }
.topbar-title h1 {
  margin: 0; font-family: var(--font-head); font-size: 38px; line-height: 1; color: var(--forest-800); font-weight: 700;
}
.topbar-title p { margin: 2px 0 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-actions { display: flex; gap: 10px; align-items: center; }
.content { padding: 8px 28px 40px; flex: 1; min-width: 0; }
.scrim { display: none; }

/* ---------- Buttons & inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px;
  border-radius: 12px; border: 1px solid transparent; font-weight: 600; font-size: 14px;
  text-decoration: none; cursor: pointer; white-space: nowrap; background: var(--white);
}
.btn .ico { width: 18px; height: 18px; }
.btn-primary { background: var(--forest); color: var(--white); }
.btn-primary:hover { background: var(--forest-700); }
.btn-secondary { background: var(--white); border-color: var(--line); color: var(--ink); }
.btn-secondary:hover { background: var(--sage-25); border-color: var(--sage-200); }
.btn-ghost { background: none; color: var(--forest); }
.btn-ghost:hover { background: var(--sage-100); }
.btn-danger { background: none; color: var(--st-red); }
.btn-danger:hover { background: var(--st-red-bg); }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: .55; cursor: default; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 0; background: none; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); flex: none;
}
.icon-btn:hover { background: var(--sage-100); }
.icon-btn.sm { width: 32px; height: 32px; border-radius: 10px; }
.icon-btn.sm .ico { width: 16px; height: 16px; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; min-width: 0; }
.field > label, .label-sm { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.input, select.input, textarea.input {
  height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--white); outline: none; width: 100%; min-width: 0;
}
textarea.input { height: auto; min-height: 84px; padding: 10px 12px; resize: vertical; line-height: 1.5; }
.input:focus { border-color: var(--green-500); box-shadow: 0 0 0 3px rgba(139, 196, 169, .25); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; }
.check input { width: 18px; height: 18px; accent-color: var(--forest); }
.search {
  position: relative; display: flex; align-items: center;
}
.search .ico { position: absolute; left: 12px; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.search input { padding-left: 36px; width: 240px; }
.seg { display: inline-flex; background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.seg button {
  border: 0; background: none; height: 32px; padding: 0 12px; border-radius: 9px; cursor: pointer;
  color: var(--muted); font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
}
.seg button .ico { width: 16px; height: 16px; }
.seg button.on { background: var(--sage-100); color: var(--forest-800); }

/* ---------- Cards, chips ---------- */
.card { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-pad { padding: 20px; }
.card h3 { margin: 0 0 12px; font-size: 15px; font-weight: 700; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px;
  font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--st-gray-bg); color: var(--st-gray);
}
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.gray { background: var(--st-gray-bg); color: var(--st-gray); }
.chip.blue { background: var(--st-blue-bg); color: var(--st-blue); }
.chip.green { background: var(--st-green-bg); color: var(--st-green); }
.chip.purple { background: var(--st-purple-bg); color: var(--st-purple); }
.chip.red { background: var(--st-red-bg); color: var(--st-red); }
.chip.amber { background: var(--st-amber-bg); color: var(--st-amber); }
.tag { display: inline-flex; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--sage-100); color: var(--forest-700); font-size: 11px; font-weight: 600; align-items: center; }
.badge { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; background: var(--st-amber-bg); color: var(--st-amber); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.badge.red { background: var(--st-red-bg); color: var(--st-red); }

/* ---------- Toolbar ---------- */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 18px; }
.toolbar .spacer { flex: 1; }

/* ---------- Dashboard ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 20px; }
.kpi { padding: 18px 20px; }
.kpi .k-label { font-size: 12px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.kpi .k-label .ico { width: 16px; height: 16px; color: var(--forest); }
.kpi .k-val { font-size: 28px; font-weight: 700; margin-top: 8px; color: var(--forest-800); letter-spacing: -.5px; }
.kpi .k-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.dash-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
.dash-grid .stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.stage-bars { display: flex; flex-direction: column; gap: 12px; }
.stage-bar { display: grid; grid-template-columns: 130px 1fr 80px; gap: 12px; align-items: center; font-size: 13px; }
.stage-bar .track { height: 10px; background: var(--sage-100); border-radius: 999px; overflow: hidden; }
.stage-bar .fill { height: 100%; border-radius: 999px; background: var(--green-500); }
.stage-bar .num { text-align: right; font-weight: 600; }
.list { display: flex; flex-direction: column; }
.list-row {
  display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-top: 1px solid var(--line); cursor: pointer;
}
.list-row:first-child { border-top: 0; }
.list-row:hover { background: var(--sage-25); }
.list-row .grow { flex: 1; min-width: 0; }
.list-row .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-row .sub { font-size: 12px; color: var(--muted); }
.list-row .amt { font-weight: 700; white-space: nowrap; }

/* ---------- Board ---------- */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: 16px; overflow-x: auto; padding-bottom: 12px; align-items: start; }
.col { background: var(--sage-100); border-radius: var(--radius); padding: 10px; min-height: 200px; display: flex; flex-direction: column; gap: 10px; transition: background .15s; }
.col.drop { background: var(--sage-200); }
.col-head { display: flex; align-items: center; gap: 8px; padding: 4px 6px 2px; }
.col-head .name { font-weight: 700; }
.col-head .count { color: var(--muted); font-weight: 600; font-size: 12px; }
.col-head .sum { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--forest-700); }
.col-add { border: 1px dashed var(--sage-200); background: rgba(255,255,255,.5); border-radius: 12px; height: 38px; cursor: pointer; color: var(--forest); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
.col-add:hover { background: var(--white); }
.col-add .ico { width: 16px; height: 16px; }
.tile {
  background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 14px; cursor: pointer;
  box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 8px;
}
.tile:hover { border-color: var(--sage-200); box-shadow: var(--shadow); }
.tile.dragging { opacity: .5; }
.tile .t-top { display: flex; align-items: center; gap: 8px; }
.tile .t-num { font-size: 12px; font-weight: 700; color: var(--muted); }
.tile .t-amt { margin-left: auto; font-weight: 700; color: var(--forest-800); }
.tile .t-title { font-weight: 700; font-size: 15px; line-height: 1.3; }
.tile .t-sub { font-size: 12px; color: var(--muted); line-height: 1.4; }
.tile .t-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tile .t-photo { width: 100%; aspect-ratio: 16/10; border-radius: 10px; object-fit: cover; background: var(--sage-100); display: block; }
.tile .t-move { display: none; }

/* ---------- Table ---------- */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 12px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 14px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover { background: var(--sage-25); }
.tbl .num { text-align: right; white-space: nowrap; }
.tbl .strong { font-weight: 600; }

/* ---------- Grid of cards ---------- */
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.pcard { padding: 18px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; }
.pcard:hover { box-shadow: var(--shadow-lg); }
.pcard .p-name { font-weight: 700; font-size: 16px; }
.pcard .p-price { font-size: 22px; font-weight: 700; color: var(--forest-800); }
.pcard .p-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--sage-100); color: var(--forest); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: none; }

/* ---------- Drawer ---------- */
.drawer-scrim { position: fixed; inset: 0; background: rgba(44, 56, 50, .3); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; }
.drawer-scrim.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; height: 100%; width: min(640px, 100%); background: var(--warm-white);
  box-shadow: var(--shadow-lg); transform: translateX(100%); transition: transform .25s ease; z-index: 60;
  display: flex; flex-direction: column;
}
.drawer.open { transform: none; }
.drawer-head { display: flex; align-items: center; gap: 12px; padding: 18px 24px; border-bottom: 1px solid var(--line); }
.drawer-head h2 { margin: 0; flex: 1; font-family: var(--font-head); font-size: 34px; color: var(--forest-800); line-height: 1; }
.drawer-body { flex: 1; overflow-y: auto; padding: 20px 24px; }
.drawer-foot { padding: 14px 24px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; background: var(--white); }
.drawer-foot .spacer { flex: 1; }
.section-title { font-size: 13px; font-weight: 700; color: var(--forest-700); text-transform: uppercase; letter-spacing: .6px; margin: 22px 0 12px; display: flex; align-items: center; gap: 8px; }
.section-title:first-child { margin-top: 0; }

/* Line items */
.items { display: flex; flex-direction: column; gap: 10px; }
.item { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.item-main { display: grid; grid-template-columns: 1fr 70px 100px 32px; gap: 8px; align-items: end; }
.item-main .field { margin: 0; }
.item-total { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 13px; }
.item-total strong { font-size: 14px; }
.addons { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.addon { display: grid; grid-template-columns: 1fr 100px 32px; gap: 8px; }
.addon .input { height: 34px; font-size: 13px; }
.link-btn { border: 0; background: none; color: var(--forest); font-weight: 600; cursor: pointer; padding: 4px 0; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
.link-btn .ico { width: 14px; height: 14px; }
.summary { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.sum-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; gap: 12px; }
.sum-row .input { width: 110px; height: 34px; text-align: right; }
.sum-row.total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; font-size: 18px; font-weight: 700; color: var(--forest-800); }
.sum-row.profit { font-size: 13px; color: var(--muted); }
.money-in { position: relative; }
.money-in::before { content: "$"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }
.money-in .input { padding-left: 22px; }
.sum-row .money-in .input { padding-left: 22px; }

/* Photos & links */
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.photo { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--sage-100); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .icon-btn { position: absolute; top: 4px; right: 4px; background: rgba(255,255,255,.9); }
.photo-add { aspect-ratio: 1; border: 1px dashed var(--sage-200); border-radius: 12px; display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: center; color: var(--forest); font-weight: 600; font-size: 12px; cursor: pointer; background: var(--white); }
.photo-add:hover { background: var(--sage-25); }
.links { display: flex; flex-direction: column; gap: 8px; }
.link-row { display: flex; gap: 8px; align-items: center; }
.link-row a { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Empty, toast, loading */
.empty { text-align: center; padding: 48px 20px; color: var(--muted); }
.empty img { width: 56px; opacity: .85; }
.empty h3 { font-family: var(--font-head); font-size: 30px; color: var(--forest); margin: 10px 0 4px; }
.empty p { margin: 0 0 16px; }
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); background: var(--forest-800); color: var(--white);
  padding: 12px 18px; border-radius: 12px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .2s; z-index: 80; box-shadow: var(--shadow-lg);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: var(--st-red); }
.loading { position: fixed; inset: 0; background: var(--sage-50); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: var(--forest); font-weight: 600; transition: opacity .3s; }
.loading img { width: 64px; animation: pulse 1.4s ease-in-out infinite; }
.loading.hide { opacity: 0; pointer-events: none; }
@keyframes pulse { 50% { transform: scale(.9); opacity: .7; } }

.due-over { color: var(--st-red); font-weight: 600; }
.due-soon { color: var(--st-amber); font-weight: 600; }
.hint { font-size: 12px; color: var(--muted); margin: -6px 0 14px; }
.margin-good { color: var(--st-green); font-weight: 600; }
.margin-low { color: var(--st-amber); font-weight: 600; }

/* ---------- Responsive ---------- */
@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dash-grid { grid-template-columns: 1fr; }
}
@media (max-width: 820px) {
  .mobile-only { display: inline-flex !important; }
  .desktop-only { display: none !important; }
  .sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); transition: transform .25s ease; box-shadow: var(--shadow-lg); width: 270px !important; }
  .app.nav-open .sidebar { transform: none; }
  .app.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(44,56,50,.3); z-index: 25; }
  .app .sidebar .label, .app .sidebar .brand-full, .app .sidebar .brand-sub { display: initial !important; }
  .app .sidebar .brand-mark { display: none !important; }
  .collapse-btn { display: none; }

   Order matters: theme (light) -> generic dark -> theme (dark).
   ================================================================ */
html[data-theme] {
  --on-accent: #FFFFFF; --toast-bg: #2F473C; --topbar-bg: rgba(244, 248, 245, .9); --scrim: rgba(44, 56, 50, .3);
  --focus-ring: rgba(139, 196, 169, .3); --note-bg: #FFF6E5; --inv-bg: #e9eeeb;
  --hello-bg: linear-gradient(120deg, var(--white) 0%, var(--sage-50) 55%, var(--rose-50) 100%);
  --rgb: linear-gradient(90deg, #FF2D95, #7B61FF, #00B8D9, #20C997, #FF2D95);
  --rainbow: linear-gradient(90deg, #FFB3C7, #FFD48A, #FFF1A8, #B9F0C9, #A8D8FF, #C9B8FF);
  --cane: repeating-linear-gradient(-45deg, #C8102E 0 10px, #FFFFFF 10px 20px);
}

/* ---------------- Theme decorations (work in light and dark) ---------------- */
/* Holiday: buffalo plaid, pine garland with berries & baubles, gift-ribbon cards, gold sparkle */
html[data-theme="holiday"] {
  --plaid: repeating-linear-gradient(90deg, rgba(179, 52, 63, .9) 0 8px, rgba(31, 94, 63, .9) 8px 16px),
           repeating-linear-gradient(0deg, rgba(0, 0, 0, .18) 0 8px, transparent 8px 16px);
  --hello-bg: radial-gradient(circle at 92% 18%, rgba(217, 180, 90, .28), transparent 34%), linear-gradient(120deg, var(--white) 0%, #F3F6EE 50%, #FBEDEC 100%);
}
html[data-theme="holiday"][data-mode="dark"] {
  --plaid: repeating-linear-gradient(90deg, rgba(226, 85, 99, .85) 0 8px, rgba(38, 119, 78, .85) 8px 16px),
           repeating-linear-gradient(0deg, rgba(0, 0, 0, .28) 0 8px, transparent 8px 16px);
  --hello-bg: radial-gradient(circle at 92% 18%, rgba(232, 198, 111, .16), transparent 34%), linear-gradient(120deg, #1A2A1F 0%, #172019 50%, #2B1A1D 100%);
}
html[data-theme="holiday"] .sidebar { background-image: linear-gradient(180deg, rgba(31, 94, 63, .09), rgba(179, 52, 63, .07)); }
html[data-theme="holiday"] .sidebar::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 8px; background: var(--plaid); z-index: 1; }
html[data-theme="holiday"] .topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -9px; height: 14px; pointer-events: none;
  background: radial-gradient(circle at 18px 7px, #B3343F 3.5px, transparent 4.5px) 0 0 / 96px 14px,
              radial-gradient(circle at 26px 9px, #D9434F 2.5px, transparent 3.5px) 0 0 / 96px 14px,
              radial-gradient(circle at 66px 8px, #E8C66F 4.5px, transparent 5.5px) 0 0 / 96px 14px,
              radial-gradient(ellipse 12px 4px at 42px 4px, #2F7A55 98%, transparent) 0 0 / 96px 14px,
              radial-gradient(ellipse 12px 4px at 90px 5px, #1F5E3F 98%, transparent) 0 0 / 96px 14px,
              linear-gradient(#2A6B48, #2A6B48) 0 3px / 100% 3px no-repeat; }
html[data-theme="holiday"] .nav-item.active { background: color-mix(in srgb, var(--rose) 12%, var(--white)); color: var(--rose); box-shadow: inset 3px 0 0 var(--gold); }
html[data-theme="holiday"] .nav-item.active .ico { color: var(--rose); }
html[data-theme="holiday"] .card.kpi { position: relative; border-top: 4px solid #1F5E3F; overflow: hidden; }
html[data-theme="holiday"] .card.kpi:nth-child(2) { border-top-color: #B3343F; }
html[data-theme="holiday"] .card.kpi:nth-child(3) { border-top-color: #D9B45A; }
html[data-theme="holiday"] .card.kpi:nth-child(4) { border-top-color: #B3343F; }
html[data-theme="holiday"] .card.kpi::after { content: ""; position: absolute; top: 0; right: 22px; width: 10px; height: 100%; background: color-mix(in srgb, var(--gold) 22%, transparent); pointer-events: none; }
html[data-theme="holiday"] .pcard { border-top: 3px solid #1F5E3F; }
html[data-theme="holiday"] .grid-cards > .pcard:nth-child(3n+2) { border-top-color: #B3343F; }
html[data-theme="holiday"] .grid-cards > .pcard:nth-child(3n+3) { border-top-color: #D9B45A; }
html[data-theme="holiday"] .tag { background: var(--gold-50); color: color-mix(in srgb, var(--gold) 45%, var(--ink)); }
html[data-theme="holiday"] .section-title { color: var(--rose); }
html[data-theme="holiday"] .col { background: color-mix(in srgb, var(--sage-100) 70%, var(--rose-50)); }
html[data-theme="holiday"] .col:nth-child(even) { background: color-mix(in srgb, var(--sage-100) 60%, var(--gold-50)); }
html[data-theme="holiday"] .stage-bar .fill, html[data-theme="holiday"] .hst-fill { background: repeating-linear-gradient(-45deg, #B3343F 0 8px, #1F5E3F 8px 16px); }
html[data-theme="holiday"] .c6-col:nth-child(3n+1) .c6-bar { background: #2F7A55; }
html[data-theme="holiday"] .c6-col:nth-child(3n+2) .c6-bar { background: #B3343F; }
html[data-theme="holiday"] .c6-col:nth-child(3n+3) .c6-bar { background: #D9B45A; }
html[data-theme="holiday"] .c6-col:hover .c6-bar, html[data-theme="holiday"] .c6-col.on .c6-bar { filter: brightness(1.12); }
html[data-theme="holiday"] .hello h2::after { content: " ❄️"; }
html[data-theme="holiday"] .topbar-title h1, html[data-theme="holiday"] #pageTitle { color: var(--forest-800); text-shadow: 0 1px 0 color-mix(in srgb, var(--gold) 45%, transparent); }
html[data-theme="holiday"] .drawer-head { border-bottom: 0; box-shadow: inset 0 -4px 0 0 transparent; background-image: var(--plaid); background-size: 100% 5px; background-repeat: no-repeat; background-position: bottom; }
/* Christmas: candy canes + twinkle lights (the sidebar is already positioned, so no position change here) */
html[data-theme="christmas"] .sidebar::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--cane); z-index: 1; }
html[data-theme="christmas"] .topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -7px; height: 10px; pointer-events: none;
  background: radial-gradient(circle at 10px 5px, #E63946 3px, transparent 4px) 0 0 / 80px 10px,
              radial-gradient(circle at 30px 5px, #F4C430 3px, transparent 4px) 0 0 / 80px 10px,

  D.paid = $('#oPaid').checked;
  if (D.paid && $('#oDatePaid')) D.datePaid = $('#oDatePaid').value;                       // Phase 2 Step 2A-3
  // Paid-by step (Nov 2026): how the customer paid is required when an order is marked paid
  var storedO = D.id ? byId('Orders', D.id) : null, paidBy = '', pbSel = $('#oPaidBy');

  if (D.stage === DONE && D.delivery === 'Shipping' && !(storedO && storedO.stage === DONE) && !D._shipAsked && typeof shipSuppliesDialog === 'function') {
    shipSuppliesDialog(D, '<h3 class="qa-title">Mark ' + esc(D.number || 'this order') + ' shipped</h3>', 'Save order', function (list) {

  }

    .then(function (o) { if (typeof after === 'function') { render(); after(o); return; } closeDrawer(); render(); toast('Saved ' + o.number); })
    .catch(function (e) { unbusy(btn); fail(e); });
}

/* Resize photos in the browser before uploading (max 1600px, JPEG) */
function shrinkImage(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onerror = function () { reject(new Error('Could not read ' + file.name)); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { reject(new Error(file.name + ' is not an image this browser can open.')); };
      img.onload = function () {
        var max = 1600, w = img.width, h = img.height;
        if (w > max || h > max) { var r = Math.min(max / w, max / h); w = Math.round(w * r); h = Math.round(h * r); }
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        var dataUrl = c.toDataURL('image/jpeg', 0.85);
        resolve({ mime: 'image/jpeg', base64: dataUrl.split(',')[1], dataUrl: dataUrl });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function loadPhotos() {
  $$('img[data-photo]').forEach(function (img) {
    var id = img.getAttribute('data-photo');
    if (S.photoCache[id]) { img.src = S.photoCache[id]; return; }
    if (S.photoCache[id] === false) return;
    S.photoCache[id] = false;
    call('getPhoto', id).then(function (url) {
      S.photoCache[id] = url;
      $$('img[data-photo="' + id + '"]').forEach(function (el) { el.src = url; });
    }).catch(function () { delete S.photoCache[id]; });
  });
}

/* ---------------- Trash (Phase 2 Step 2A-4) ----------------
   Deleting a customer, product, material, expense, supplier, list or list item moves it here for 30 days.
   Restore puts it back exactly as it was; "Delete forever" removes it (and its photos/receipts) for good. */
var TRASHABLE = { Orders: 1, Customers: 1, Products: 1, Materials: 1, Expenses: 1, Suppliers: 1, Lists: 1, ListItems: 1, Tasks: 1 };   // Orders: Phase 2 Step 2A-5; Tasks (to-dos): 2B-3
var TRASH_TYPES = { Orders: 'Order', Customers: 'Customer', Products: 'Product', Materials: 'Material', Expenses: 'Expense', Suppliers: 'Supplier', Lists: 'List', ListItems: 'List item', Tasks: 'To-do' };
function trashLabel(t, r) {
  if (t === 'Orders') return (r.number || 'Order') + ' · ' + (r.customerName || 'No customer') + ' · ' + money(r.total);
  if (t === 'Expenses') return (r.vendor || 'Expense') + ' · ' + money(r.amount) + (r.date ? ' · ' + niceDate(r.date) : '');
  if (t === 'ListItems') { var l = byId('Lists', r.listId); return (r.title || 'Untitled') + (l ? ' (' + l.name + ')' : ''); }
  return r.name || r.title || 'Untitled';
}
function trashSub(t, r) {
  if (t === 'Orders') return [r.stage, r.paid ? 'paid' : 'unpaid', trashOrderStock(r) ? 'stock was returned' : ''].filter(Boolean).join(' · ');
  if (t === 'Customers') { var n = S.data.Orders.filter(function (o) { return o.customerId === r.id; }).length; return [r.email, r.phone, n ? n + ' order(s) still linked' : ''].filter(Boolean).join(' · '); }
  if (t === 'Products') return [r.category, money(r.price)].filter(Boolean).join(' · ');
  if (t === 'Tasks') return r.dueDate ? 'was due ' + niceDate(String(r.dueDate).slice(0, 10)) : '';   // Phase 2 Step 2B-3
  if (t === 'Lists') { var e = (S.trash || []).filter(function (x) { return x.table === 'Lists' && x.record.id === r.id; })[0]; var k = e ? e.items : 0; return k ? k + ' item(s) went with it' : ''; }
  return '';
}
function trashOrderStock(r) { return (r.log || []).some(function (l) { return l && l.stockReturned && Object.keys(l.stockReturned).length && Math.abs(new Date(l.trashedAt).getTime() - new Date(String(r.deleted).slice(0, 24)).getTime()) < 1000; }); }
function trashGoneDay(iso) { var d = new Date(String(iso).slice(0, 24)); d.setDate(d.getDate() + 30); return d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' }); }
function renderTrash() {
  var items = S.trash || [];
  if (!items.length) return emptyState('Trash is empty', 'Deleted orders, customers, products, materials, expenses, suppliers and lists are kept here for 30 days so you can restore them.');
  return '<p class="muted" style="margin:0 0 12px">Items stay here for 30 days, then they are removed for good. Your daily backups keep older copies.</p>' +
    '<div class="card">' + items.map(function (it) {
      var key = esc(it.table + '|' + it.record.id);
      return '<div class="list-row trash-row"><div class="grow"><div class="title">' + esc(trashLabel(it.table, it.record)) + '</div>' +
        '<div class="sub">' + esc(TRASH_TYPES[it.table] || it.table) + ' · deleted ' + esc(niceDate(String(it.deleted).slice(0, 10))) + ' · removed for good ' + esc(trashGoneDay(it.deleted)) +
        (trashSub(it.table, it.record) ? ' · ' + esc(trashSub(it.table, it.record)) : '') + '</div></div>' +
        '<button class="btn btn-secondary btn-sm" type="button" data-trash-restore="' + key + '">Restore</button>' +
        '<button class="btn btn-ghost btn-sm trash-forever" type="button" data-trash-forever="' + key + '">Delete forever</button></div>';
    }).join('') + '</div>';
}
function moveToTrash(table, id) {
  return call('trashRecord', table, id).then(function (res) {
    S.data[table] = S.data[table].filter(function (r) { return r.id !== id; });
    if (table === 'Lists') S.data.ListItems = S.data.ListItems.filter(function (x) { return x.listId !== id; });
    S.trash = (S.trash || []).filter(function (x) { return !(x.table === table && x.record.id === id); });
    S.trash.unshift({ table: table, deleted: res.deleted, record: res.record, items: (res.items || []).length });
    renderNav();
    if (table === 'Orders' && typeof afterOrderSaved === 'function') afterOrderSaved();   // stock may have changed
    var back = res.stock && res.stock.returned ? Object.keys(res.stock.returned).length : 0;
    toastUndo((TRASH_TYPES[table] || 'Item') + ' moved to Trash' + (back ? ' · stock returned' : ''), function () { restoreFromTrash(table, id); });
    return res;
  });
}
function restoreFromTrash(table, id) {
  return call('restoreRecord', table, id).then(function (res) {
    var list = S.data[table]; if (!list.some(function (r) { return r.id === id; })) list.push(res.record);
    (res.items || []).forEach(function (it) { if (!S.data.ListItems.some(function (x) { return x.id === it.id; })) S.data.ListItems.push(it); });
    S.trash = (S.trash || []).filter(function (x) { return !(x.table === table && x.record.id === id); });
    var st = res.stock || {}, taken = st.taken ? Object.keys(st.taken).length : 0;
    if (table === 'Orders' && typeof afterOrderSaved === 'function') afterOrderSaved();   // stock may have changed
    render(); toast((TRASH_TYPES[table] || 'Item') + ' restored' + (taken ? ' · stock taken out again' : ''));
    var warn = [];
    if (st.missing && st.missing.length) warn.push('These materials no longer exist, so their stock was not taken out: ' + st.missing.join(', ') + '.');
    if (st.below && st.below.length) warn.push('Stock is now below zero for: ' + st.below.join(', ') + '.');
    if (warn.length) alert((TRASH_TYPES[table] || 'Item') + ' restored.\n\n' + warn.join('\n\n'));
  }).catch(fail);
}
function deleteForeverFromTrash(table, id) {
  var it = (S.trash || []).filter(function (x) { return x.table === table && x.record.id === id; })[0];
  if (!confirm('Delete "' + (it ? trashLabel(table, it.record) : 'this item') + '" for good? This can\'t be undone (only your daily backups will still have it). Its photos/receipts go to your Google Drive trash, unless another record also uses them.')) return;
  call('deleteForever', table, id).then(function (res) {
    S.trash = (S.trash || []).filter(function (x) { return !(x.table === table && x.record.id === id); });
    var k = res && res.kept ? res.kept.length : 0;
    render(); toast('Deleted for good' + (k ? ' · ' + k + ' file(s) kept in Google Drive because another record uses them' : ''));
  }).catch(fail);
}
function toastUndo(msg, undo, opts) {   // opts (Phase 2 Step 2B-3): { ms, extra: { label, fn } }
  opts = opts || {};
  var t = $('#toast');
  t.innerHTML = esc(msg) + (opts.extra ? ' <button type="button" class="toast-undo toast-extra">' + esc(opts.extra.label) + '</button>' : '') + ' <button type="button" class="toast-undo toast-main">Undo</button>';
  t.className = 'toast show undo';
  var b = t.querySelector('.toast-main');
  b.addEventListener('click', function () { t.className = 'toast'; undo(); }, { once: true });
  var x = t.querySelector('.toast-extra');
  if (x) x.addEventListener('click', function () { t.className = 'toast'; opts.extra.fn(); }, { once: true });
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.className = 'toast'; }, opts.ms || 7000);
}
document.addEventListener('DOMContentLoaded', function () {   // added last, so Trash sits at the end of the menu
  if (!VIEWS.some(function (v) { return v.key === 'trash'; })) VIEWS.push({ key: 'trash', label: 'Trash', icon: 'trash', sub: 'Deleted items are kept here for 30 days' });
  try { renderNav(); } catch (e) {}
});
document.addEventListener('click', function (e) {
  var r = e.target.closest('[data-trash-restore]'), f = e.target.closest('[data-trash-forever]');
  if (r) { var a = r.getAttribute('data-trash-restore').split('|'); restoreFromTrash(a[0], a[1]); }
  if (f) { var b = f.getAttribute('data-trash-forever').split('|'); deleteForeverFromTrash(b[0], b[1]); }
});

/* ---------------- Customer picker on the order form ----------------
   Type to find a customer (name, phone or email); "+ Add a new customer" is always first.
   The hidden select keeps holding the choice, so saving works exactly as before. */
function setOrderCustomer(id, newName) {
  var sel = $('#oCustomer'), inp = $('#oCustSearch'); if (!sel) return;
  sel.value = id || '';
  if (inp) { var opt = sel.options[sel.selectedIndex]; inp.value = id && id !== '__new' && opt ? opt.text.replace(/ \(in Trash\)$/, '') : (id === '__new' ? '' : inp.value); }
  sel.dispatchEvent(new Event('change', { bubbles: true }));
  if (id === '__new' && newName && $('#ncName')) $('#ncName').value = newName;
}
function bindCustomerPicker() {
  var inp = $('#oCustSearch'), list = $('#oCustList'), active = 0, items = [];
  if (!inp || !list) return;
  var draw = function () {
    var q = inp.value.trim().toLowerCase(), digits = q.replace(/[^0-9]/g, '');
    var hits = S.data.Customers.filter(function (c) {
      if (!q) return true;
      var hay = [c.name, c.email, c.phone].join(' ').toLowerCase();
      return hay.indexOf(q) >= 0 || (digits.length >= 3 && String(c.phone || '').replace(/[^0-9]/g, '').indexOf(digits) >= 0);
    }).sort(function (a, b) {
      var an = String(a.name || '').toLowerCase(), bn = String(b.name || '').toLowerCase();
      var as = q && an.indexOf(q) === 0 ? 0 : 1, bs = q && bn.indexOf(q) === 0 ? 0 : 1;   // names starting with what you typed first
      return as - bs || an.localeCompare(bn);
    });
    items = [{ id: '__new', label: '+ Add a new customer' + (q ? ' "' + inp.value.trim() + '"' : '') }].concat(hits.slice(0, 50).map(function (c) {
      return { id: c.id, label: c.name || 'Unnamed customer', sub: [c.phone, c.email].filter(Boolean).join(' · ') };
    }));
    if (active >= items.length) active = items.length - 1;
    list.innerHTML = items.map(function (it, i) {
      return '<div class="cust-opt' + (i === active ? ' on' : '') + (it.id === '__new' ? ' new' : '') + '" role="option" data-cid="' + esc(it.id) + '">' +
        '<span>' + esc(it.label) + '</span>' + (it.sub ? '<span class="muted small">' + esc(it.sub) + '</span>' : '') + '</div>';
    }).join('') + (hits.length > 50 ? '<div class="muted small cust-more">Keep typing to narrow down ' + hits.length + ' customers…</div>' : '') +
      (q && !hits.length ? '<div class="muted small cust-more">No customer matches "' + esc(inp.value.trim()) + '"</div>' : '');
    list.hidden = false;
  };
  var pick = function (id) {
    var typed = inp.value.trim();
    list.hidden = true;
    setOrderCustomer(id, id === '__new' ? typed : '');
  };
  inp.addEventListener('focus', function () { active = 0; draw(); inp.select(); });
  inp.addEventListener('input', function () { active = inp.value.trim() ? 1 : 0; draw(); });

    case 'checkbox': return v ? '<span class="chip green">' + ico('check').replace('class="ico"', 'class="ico" style="width:12px;height:12px"') + 'Yes</span>' : '<span class="muted">—</span>';
    case 'date':

      return '<span class="' + cls + '">' + esc(niceDate(v)) + '</span>';
    case 'select':

document.addEventListener('click', function (e) {

<script>
/* ================================================================
   Business reports (Phase 2 Step 2B-4)
   Read-only: everything is worked out in the app from the data it already has.
   "Count by" decides which date puts an order in a period:
     payment date (default) – the order's date paid
     order date            – the day the order was created
     completion date       – the order's date completed
   Inquiries and Trash are always left out. Orders without the chosen date are never put in any period
   and are listed as "unknown" instead: no date is ever estimated or invented.
   Expenses always count by their own expense date.
   The download uses exactly the same figures as the screen (one shared model).
   The only thing this page can change is a date Sara types in under "Dates to check", saved through the
   normal safe save (the server records the change in the order's history).
   ================================================================ */
Object.assign(ICONS, {
  report: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  chevRight: '<path d="m9 6 6 6-6 6"/>'
});
VIEWS.push({ key: 'reports', label: 'Reports', icon: 'report', sub: 'Sales, expenses and best sellers for any month, quarter or year' });

var REP_BASES = [
  { k: 'paid', label: 'Payment date', short: 'payment date', field: 'date paid' },
  { k: 'order', label: 'Order date', short: 'order date', field: 'order date' },
  { k: 'done', label: 'Completion date', short: 'completion date', field: 'date completed' }
];
var REP_MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var REP = (function () {
  var d = new Date(), r = { per: 'year', y: d.getFullYear(), q: Math.floor(d.getMonth() / 3) + 1, m: d.getMonth() + 1, basis: 'paid', more: {} };
  try { var s = JSON.parse(localStorage.getItem('os.reports') || 'null'); if (s && /^(month|quarter|year)$/.test(s.per) && /^(paid|order|done)$/.test(s.basis)) { r.per = s.per; r.basis = s.basis; } } catch (e) {}
  return r;   // the period itself always starts at this year / quarter / month; only the kind of period and "Count by" are remembered
})();
function repSave() { try { localStorage.setItem('os.reports', JSON.stringify({ per: REP.per, basis: REP.basis })); } catch (e) {} }
function repBasis(k) { return REP_BASES.filter(function (b) { return b.k === (k || REP.basis); })[0]; }

/* ---------- dates ---------- */
function repLocalDay(v) {   // a timestamp (order created) → its day on this device (Halifax for Sara); a plain date stays as it is
  if (!v) return '';
  var s = String(v);
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  var d = new Date(s); if (isNaN(d)) return '';
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function repRange(p) {
  p = p || REP;
  var y = p.y, a, b;
  if (p.per === 'year') { a = y + '-01-01'; b = y + '-12-31'; }
  else if (p.per === 'quarter') { var m0 = (p.q - 1) * 3 + 1; a = y + '-' + pad(m0) + '-01'; b = y + '-' + pad(m0 + 2) + '-' + pad(new Date(y, m0 + 2, 0).getDate()); }
  else { a = y + '-' + pad(p.m) + '-01'; b = y + '-' + pad(p.m) + '-' + pad(new Date(y, p.m, 0).getDate()); }
  return { from: a, to: b };
}
function repPeriodLabel(p) {
  p = p || REP;
  if (p.per === 'year') return String(p.y);
  if (p.per === 'quarter') return 'Q' + p.q + ' ' + p.y + ' (' + REP_MONTHS[(p.q - 1) * 3] + '–' + REP_MONTHS[(p.q - 1) * 3 + 2] + ')';
  return monthName(p.m - 1) + ' ' + p.y;
}
function repShift(n) {
  if (REP.per === 'year') REP.y += n;
  else if (REP.per === 'quarter') { REP.q += n; if (REP.q < 1) { REP.q = 4; REP.y--; } if (REP.q > 4) { REP.q = 1; REP.y++; } }
  else { REP.m += n; if (REP.m < 1) { REP.m = 12; REP.y--; } if (REP.m > 12) { REP.m = 1; REP.y++; } }
}
function repIsPaid(o) { return o.paid === true || o.paid === 'TRUE' || o.paid === 'true'; }
/** The day an order counts on for a basis: a 'YYYY-MM-DD' day, null = applies but unknown, undefined = doesn't apply. */
function repDay(o, basis) {
  if (basis === 'order') return repLocalDay(o.created) || null;
  if (basis === 'paid') return repIsPaid(o) ? (o.datePaid ? String(o.datePaid).slice(0, 10) : null) : undefined;
  if (basis === 'done') return o.stage === DONE ? (o.dateCompleted ? String(o.dateCompleted).slice(0, 10) : null) : undefined;
}
function repOrders() { return S.data.Orders.filter(function (o) { return o.stage !== 'Inquiry' && !o.deleted; }); }
function repInRange(o, basis, r) { var d = repDay(o, basis); return !!d && d >= r.from && d <= r.to; }

/* ---------- material costs ---------- */
/** An order's material cost is "known" only when every item has a material cost recorded. */
function repCostKnown(o) {
  var items = o.items || [];
  return items.length > 0 && items.every(function (it) { return num(it.unitCost) > 0; });
}
function repItemKey(it) {
  var p = it.productId ? byId('Products', it.productId) : null;
  return p ? { key: 'p:' + p.id, name: p.name, cat: p.category || 'No category', linked: true } :
    { key: 'n:' + String(it.name || 'Item').trim().toLowerCase(), name: String(it.name || 'Item').trim(), cat: 'Not linked to a catalog product', linked: false };
}
function repSourceOf(o) { var s = String(o.source || ''); return s === 'Website' ? 'Website order form' : /zoho/i.test(s) ? 'Imported from Zoho' : 'Entered in the app'; }
function repExpenses(r) { return (S.data.Expenses || []).filter(function (e) { var d = String(e.date || '').slice(0, 10); return !e.deleted && d >= r.from && d <= r.to; }); }
function repCatLabel(k) { var c = (S.expenseCategories || []).filter(function (x) { return x.key === k; })[0]; return c ? c.label : (k || 'Other'); }
function repSum(list) { return round2(list.reduce(function (t, o) { return t + num(o.total); }, 0)); }

/* ---------- the model: every figure on the page and in the download ---------- */
function repModel(p) {
  p = p || REP;
  var basis = p.basis, r = repRange(p), all = repOrders();
  var inP = all.filter(function (o) { return repInRange(o, basis, r); })
    .sort(function (a, b) { return String(repDay(b, basis)).localeCompare(String(repDay(a, basis))) || String(b.number).localeCompare(String(a.number), undefined, { numeric: true }); });
  var sales = repSum(inP), exp = repExpenses(r), expTotal = round2(exp.reduce(function (t, e) { return t + num(e.amount); }, 0));
  var known = inP.filter(repCostKnown), mat = { orders: known.length, of: inP.length, sales: repSum(known), cost: 0, profit: 0 };
  known.forEach(function (o) { var c = calcOrder(o); mat.cost += c.cost; mat.profit += c.profit; });
  mat.cost = round2(mat.cost); mat.profit = round2(mat.profit);
  var unknown = all.filter(function (o) { return repDay(o, basis) === null; });
  var unknownHere = unknown.filter(function (o) { var d = repLocalDay(o.created); return d >= r.from && d <= r.to; });
  var unpaidIn = basis === 'paid' ? [] : inP.filter(function (o) { return !repIsPaid(o); });
  // month by month (the period's year, and the year before)
  var months = [];
  for (var i = 1; i <= 12; i++) {
    var mr = repRange({ per: 'month', y: p.y, m: i }), lr = repRange({ per: 'month', y: p.y - 1, m: i });
    months.push({ m: i, sales: repSum(all.filter(function (o) { return repInRange(o, basis, mr); })), last: repSum(all.filter(function (o) { return repInRange(o, basis, lr); })) });
  }
  // expenses by category
  var cats = {};
  exp.forEach(function (e) { var k = e.category || 'other'; cats[k] = cats[k] || { label: repCatLabel(k), total: 0, count: 0 }; cats[k].total += num(e.amount); cats[k].count++; });
  var expCats = Object.keys(cats).map(function (k) { cats[k].total = round2(cats[k].total); return cats[k]; }).sort(function (a, b) { return b.total - a.total; });
  // best sellers and product categories
  var items = {}, pcats = {}, itemCount = 0, unlinked = 0;
  inP.forEach(function (o) {
    (o.items || []).forEach(function (it) {
      var k = repItemKey(it), t = itemTotal(it); itemCount++; if (!k.linked) unlinked++;
      items[k.key] = items[k.key] || { key: k.key, name: k.name, cat: k.cat, linked: k.linked, qty: 0, sales: 0, orders: {} };
      items[k.key].qty += num(it.qty); items[k.key].sales += t; items[k.key].orders[o.id] = 1;
      pcats[k.cat] = pcats[k.cat] || { label: k.cat, linked: k.linked, qty: 0, sales: 0 };
      pcats[k.cat].qty += num(it.qty); pcats[k.cat].sales += t;
    });
  });
  var best = Object.keys(items).map(function (k) { var x = items[k]; x.sales = round2(x.sales); x.orderIds = Object.keys(x.orders); delete x.orders; return x; })
    .sort(function (a, b) { return b.sales - a.sales || b.qty - a.qty || a.name.localeCompare(b.name); });
  var prodCats = Object.keys(pcats).map(function (k) { pcats[k].sales = round2(pcats[k].sales); return pcats[k]; })
    .sort(function (a, b) { return (a.linked === b.linked ? 0 : a.linked ? -1 : 1) || b.sales - a.sales; });
  // customers and sources
  var cust = {}, src = {};
  inP.forEach(function (o) {
    var ck = o.customerId || ('name:' + (o.customerName || ''));
    cust[ck] = cust[ck] || { key: ck, name: o.customerName || 'No customer', orders: 0, sales: 0, ids: [] };
    cust[ck].orders++; cust[ck].sales += num(o.total); cust[ck].ids.push(o.id);
    var s = repSourceOf(o); src[s] = src[s] || { label: s, orders: 0, sales: 0, ids: [] };
    src[s].orders++; src[s].sales += num(o.total); src[s].ids.push(o.id);
  });
  var customers = Object.keys(cust).map(function (k) { cust[k].sales = round2(cust[k].sales); return cust[k]; }).sort(function (a, b) { return b.sales - a.sales || b.orders - a.orders; });
  var sources = Object.keys(src).map(function (k) { src[k].sales = round2(src[k].sales); return src[k]; }).sort(function (a, b) { return b.sales - a.sales; });
  // how customers paid (Paid-by step, Nov 2026): the paid orders among those counted; "Not recorded" = paid before this was tracked
  var pay = {};
  inP.forEach(function (o) {
    if (!repIsPaid(o)) return;
    var k = orderPaidBy(o) || 'none';
    pay[k] = pay[k] || { key: k, label: k === 'none' ? 'Not recorded' : payMethodLabel(k), orders: 0, total: 0, ids: [] };
    pay[k].orders++; pay[k].total += num(o.total); pay[k].ids.push(o.id);
  });
  var paidBy = ORDER_PAY_METHODS.map(function (m) { return pay[m[0]]; }).concat([pay.none]).filter(Boolean).map(function (x) { x.total = round2(x.total); return x; });
  // waiting on payment today (whatever the period)
  var unpaidNow = all.filter(function (o) { return !repIsPaid(o); }).sort(function (a, b) { return String(a.dueDate || '9999').localeCompare(String(b.dueDate || '9999')); });
  // what is incomplete in this period
  var gaps = {
    paidUnknown: all.filter(function (o) { return repIsPaid(o) && !o.datePaid; }),
    doneUnknown: all.filter(function (o) { return o.stage === DONE && !o.dateCompleted; }),
    costUnknown: inP.length - known.length, itemsUnlinked: unlinked, items: itemCount
  };
  return { p: { per: p.per, y: p.y, q: p.q, m: p.m, basis: basis }, range: r, label: repPeriodLabel(p), basis: repBasis(basis),
    orders: inP, sales: sales, count: inP.length, avg: inP.length ? round2(sales / inP.length) : 0,
    unpaidIn: { count: unpaidIn.length, total: repSum(unpaidIn), list: unpaidIn },
    expenses: exp, expTotal: expTotal, net: round2(sales - expTotal), mat: mat,
    unknown: { list: unknown, total: repSum(unknown), here: unknownHere, hereTotal: repSum(unknownHere) },
    months: months, expCats: expCats, best: best, prodCats: prodCats, customers: customers, sources: sources, paidBy: paidBy,
    unpaidNow: { list: unpaidNow, total: repSum(unpaidNow) }, gaps: gaps };
}

var REP_SAVING = false;

/* ---------------- Orders: order form link (Nov 2026) ----------------
   A one-time link to the website order form for THIS order: the customer's picks replace the order's items.
   The link's state is kept in the order's notes log (see FormServer.gs). */
var LINK_OPEN = {};   // which orders' Order form link section is open on the computer (this visit only)
function orderLinkState(o) {
  var st = { status: 'none', token: '', madeAt: '', at: '' };
  ((o && o.log) || []).forEach(function (l) {
    if (!l) return;
    if (l.orderLink) st = { status: 'waiting', token: String(l.orderLink), madeAt: l.at || '', at: '' };
    else if (st.token && l.orderLinkUsed === st.token && st.status === 'waiting') { st.status = 'used'; st.at = l.at || ''; }
    else if (st.token && l.orderLinkCancelled === st.token && st.status === 'waiting') { st.status = 'cancelled'; st.at = l.at || ''; }
  });
  return st;
}
function orderLinkBlocked(o) {
  if (!o) return 'Save the order first.';
  if (o.paid) return 'This order is paid, so its items can\'t be replaced from the order form.';
  if (o.stage === DONE) return 'This order is finished.';
  if (o.stockUsed && typeof o.stockUsed === 'object' && Object.keys(o.stockUsed).length) return 'This order has already taken materials from stock, so its items can\'t be replaced from the order form.';
  return '';
}
function orderLinkUrl(token) { return 'https://studio.craftyrosegifts.ca/order.html?o=' + token; }
function drawOrderLink(o, before) {
  var st = orderLinkState(o), why = orderLinkBlocked(o);
  if (why && st.status !== 'waiting') return;           // nothing to offer on a paid, finished or stock-taken order
  var box = document.createElement('div'); box.id = 'linkSec';
  before.insertAdjacentElement('beforebegin', box);
  var foldable = !r2Phone(), key = o.id;
  if (LINK_OPEN[key] === undefined) LINK_OPEN[key] = st.status === 'waiting';
  var sm = 'class="ico" style="width:12px;height:12px"';
  var chip = st.status === 'waiting' ? '<span class="chip blue">' + ico('link').replace('class="ico"', sm) + 'Link sent ' + esc(whenStr(st.madeAt)) + ', waiting</span>'
    : st.status === 'used' ? '<span class="chip green">' + ico('check').replace('class="ico"', sm) + 'Items chosen ' + esc(whenStr(st.at)) + '</span>'
    : st.status === 'cancelled' ? '<span class="chip gray">Link cancelled ' + esc(whenStr(st.at)) + '</span>'
    : '<span class="chip gray">Not sent yet</span>';
  var draw = function () {
    var head = '<div class="section-title">' + ico('link') + 'Order form link <span class="muted" style="font-weight:500;margin-left:4px">(optional)</span>' +
      (foldable ? '<button class="link-btn proof-tog" type="button" id="olTog" aria-expanded="' + !!LINK_OPEN[key] + '">' + (LINK_OPEN[key] ? 'Hide' : (st.status === 'none' ? 'Set up' : 'Show')) + '</button>' : '') + '</div>';
    if (foldable && !LINK_OPEN[key]) {
      box.innerHTML = head + '<div class="proof-folded">' + chip + '<span class="muted small">Let the customer pick their own items for this order.</span></div>';
      return;
    }
    var hint = st.status === 'waiting' ? 'The customer opens the order form with this link, picks their items and taps <b>Send my choices</b>. Their choices replace the items on this order. The link works once.'
      : st.status === 'used' ? 'The customer\'s choices replaced the items. The old item list is in the Notes log. You can make a new link if they need to choose again.'
      : 'Send the customer a link to your order form for this order. Their choices replace the items here (shipping, discount, dates, payment and proof stay as they are). The link works once.';
    box.innerHTML = head + '<div class="proof-box"><div style="margin-bottom:10px">' + chip + '</div>' +
      '<p class="hint" style="margin:0 0 10px">' + hint + '</p>' +
      (why ? '<p class="hint" style="margin:0 0 10px">' + esc(why) + '</p>' : '') +
      '<div class="proof-actions">' + (st.status === 'waiting'
        ? '<button class="btn btn-secondary btn-sm" type="button" id="olCopy">' + ico('link') + 'Copy link</button>' +
          '<button class="btn btn-secondary btn-sm proof-remove" type="button" id="olCancel">' + ico('x') + 'Cancel link</button>'
        : '<button class="btn btn-primary btn-sm" type="button" id="olMake">' + ico('link') + (st.status === 'none' ? 'Make link' : 'Make a new link') + '</button>') + '</div>' +
      (st.status === 'waiting' ? '<p class="hint" style="margin:8px 0 0">Paste it into Messenger, or send the <b>Choose your items</b> message, which has the link filled in.</p>' : '') + '</div>';
  };
  draw();
  box.addEventListener('click', function (e) {
    if (e.target.closest('#olTog')) { LINK_OPEN[key] = !LINK_OPEN[key]; draw(); return; }
    if (e.target.closest('#olCopy')) { copyText(orderLinkUrl(st.token), 'Order form link copied, paste it into Messenger'); return; }
    if (e.target.closest('#olCancel')) {
      qaDialog('<h3 class="qa-title">Cancel the order form link for ' + esc(o.number || 'this order') + '?</h3>' +
        '<p>The link will stop working. Nothing is sent to the customer, and the items on this order stay as they are.</p>',
        function () {
          saveOrder(function (saved) {
            call('cancelOrderLink', saved.id).then(function (r) {
              var i = S.data.Orders.findIndex(function (x) { return x.id === saved.id; }); if (i >= 0) S.data.Orders[i] = r.order;
              openOrder(saved.id); toast('Link cancelled');
            }).catch(function (err) { openOrder(saved.id); fail(err); });
          });
        }, 'Cancel link');
      return;
    }
    var mk = e.target.closest('#olMake'); if (!mk) return;
    busy(mk, 'Making link…');
    saveOrder(function (saved) {
      call('makeOrderLink', saved.id).then(function (r) {

        LINK_OPEN[saved.id] = true;

/* ---------------- Orders: shipping supplies (Nov 2026) ----------------
   Mailers and boxes are chosen per order (one larger box can hold several items), not on products. They are taken from
   stock when a Shipping order is marked Delivered/Shipped (server: applyStock_) and counted in the order's material cost. */
function shipSuppliesCost(o) {
  if (!o || o.delivery !== 'Shipping' || !Array.isArray(o.shipSupplies)) return 0;
  return round2(o.shipSupplies.reduce(function (s, x) { var m = byId('Materials', x.materialId); return s + (m ? (x.vid ? vCost(m, x.vid) : num(m.costPerUnit)) * num(x.qty) : 0); }, 0));
}
/** The supplies picker (used on the order and in the "shipped" question). list is changed in place. */
function shipPickerHtml(list) {
  return '<div class="ss-list">' + (list.length ? list.map(function (x, i) {
    var m = byId('Materials', x.materialId), vs = m ? variantsOf(m) : [];
    return '<div class="ss-row" data-ss="' + i + '"><div class="ss-name">' + esc(m ? m.name : 'A material that no longer exists') +
      '<span class="muted small">' + (m ? ' ' + money(x.vid ? vCost(m, x.vid) : num(m.costPerUnit)) + '/' + esc(m.unit || 'each') : '') + '</span></div>' +
      (vs.length ? '<select class="input ss-vid" data-ssvid="' + i + '"><option value="">' + esc(m.variantLabel || 'Colour') + '…</option>' + vs.map(function (v) { return '<option value="' + esc(v.id) + '"' + (v.id === x.vid ? ' selected' : '') + '>' + esc(v.name) + '</option>'; }).join('') + '</select>' : '') +
      '<input class="input ss-qty" type="number" min="0" step="any" inputmode="decimal" data-ssqty="' + i + '" value="' + esc(x.qty) + '" aria-label="How many">' +
      '<button class="icon-btn sm" type="button" data-ssdel="' + i + '" title="Remove">' + ico('x') + '</button></div>';
  }).join('') : '<p class="muted small ss-none">No shipping supplies chosen.</p>') + '</div>' +
    '<input class="input ss-q" type="search" placeholder="Search supplies (e.g. mailer, box)" autocomplete="off" enterkeyhint="search" aria-label="Search shipping supplies">' +
    '<div class="pick-list static ss-res" role="listbox" hidden></div>';
}
function wireShipPicker(root, list, onChange) {
  var redraw = function (keepQ) {
    var q = $('.ss-q', root), qv = q ? q.value : '';
    root.innerHTML = shipPickerHtml(list);
    if (keepQ) { $('.ss-q', root).value = qv; }
    onChange && onChange();
  };
  var drawRes = function () {
    var q = $('.ss-q', root).value, box = $('.ss-res', root);
    if (!q.trim()) { box.hidden = true; box.innerHTML = ''; return; }
    var res = matSearch(q).slice(0, 12);
    box.innerHTML = res.length ? res.map(function (m) {
      return '<button type="button" class="pick-row" role="option" data-ssadd="' + esc(m.id) + '"><span class="pick-name">' + esc(m.name) + '</span><span class="pick-sub">' + money(m.costPerUnit) + '/' + esc(m.unit || 'each') + (tracked(m) ? ' · ' + (variantsOf(m).length ? 'by colour' : num(m.onHand) + ' in stock') : '') + '</span></button>';
    }).join('') : '<p class="muted small" style="margin:6px 8px">No material matches "' + esc(q) + '".</p>';
    box.hidden = false;
  };
  root.addEventListener('input', function (e) {

  });

  });

  root.addEventListener('click', function (e) {
    var a = e.target.closest('[data-ssadd]');
    if (a) {
      var id = a.getAttribute('data-ssadd'), have = list.filter(function (x) { return x.materialId === id && !x.vid; })[0];
      if (have && !variantsOf(byId('Materials', id)).length) have.qty = num(have.qty) + 1; else list.push({ materialId: id, qty: 1 });
      redraw(); var qs = $$('.ss-qty', root); if (qs.length) qs[qs.length - 1].focus(); return;
    }

  });

function cleanShipList(list) { return list.filter(function (x) { return x.materialId && num(x.qty) > 0; }).map(function (x) { var o = { materialId: x.materialId, qty: num(x.qty) }; if (x.vid) o.vid = x.vid; return o; }); }
/** The question when a Shipping order is marked Delivered/Shipped. onOk(list, modal). */

    var el = $('#devList'); if (!el) return;
    el.innerHTML = list.length ? '<div class="list">' + list.map(function (d) {
      return '<div class="list-row"><div class="grow"><div class="title">' + esc(d.name) + (d.current ? ' <span class="chip green">This device</span>' : '') + '</div>' +
        '<div class="sub">Connected ' + esc(devWhen(d.added)) + (d.lastUsed ? ' · last used ' + esc(devWhen(d.lastUsed)) : '') + '</div></div>' +
        '<button class="btn btn-secondary btn-sm" type="button" data-devoff="' + esc(d.id) + '">Disconnect</button></div>';
    }).join('') + '</div>' : '<p class="muted small" style="margin:0">No devices connected yet.</p>';
  };
  call('listDevices').then(drawList).catch(function () { var el = $('#devList'); if (el) el.innerHTML = ''; });
  drawPushSec(sec);   // push notifications (Nov 2026)
  sec.addEventListener('click', function (e) {
    var off = e.target.closest('[data-devoff]');
    if (off) {
      if (!confirm('Disconnect this device? It will need a new code to connect again.')) return;
      busy(off, '…');
      call('revokeDevice', off.getAttribute('data-devoff')).then(function (list) { drawList(list); toast('Device disconnected'); }).catch(fail);
      return;
    }
    var b = e.target.closest('#devCode'); if (!b) return;
    busy(b, 'Making a code…');
    call('createPairCode').then(function (r) {
      $('#devCodeArea').innerHTML = '<div class="dev-code" aria-label="Your code">' + esc(r.code) + '</div>' +
        '<p class="hint" style="text-align:center;margin:0">This code works once and expires in ' + r.minutes + ' minutes.</p>' +
        '<ol class="dev-steps"><li>On your iPhone, open <b>' + esc(APP_URL.replace('https://', '')) + '</b> in Safari.</li>' +
        '<li>Tap <b>Share</b>, then <b>Add to Home Screen</b>.</li><li>Open the new rose icon and type this code.</li></ol>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn btn-secondary btn-sm" type="button" id="devCopy">' + ico('link') + 'Copy app link</button>' +
        '<button class="btn btn-secondary btn-sm" type="button" id="devCode">Make a new code</button></div>';
      $('#devCopy').addEventListener('click', function () { copyText(APP_URL, 'App link copied'); });
    }).catch(function (err) { unbusy(b); fail(err); });
  });
};
/* ---------------- Notifications on Sara's phone (Nov 2026) ----------------
   Turned on from the phone app (Home Screen icon) on each phone. The list and the test button work everywhere. */
function pnInApp() { return typeof API_URL === 'string' && typeof osPushReady === 'function'; }
function pnKeyBytes(b64) { var s = atob(b64.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((b64.length + 3) % 4)); var a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
function drawPushSec(devSec) {
  var box = document.createElement('div'); box.id = 'pnSec';
  box.innerHTML = '<div class="section-title">' + ico('bell') + 'Notifications</div><div class="dev-box">' +
    '<p style="margin:0 0 10px">Get a notification on your phone for new website orders, proof replies, order link choices, and a 9:00 AM summary of the day.</p>' +
    '<div id="pnHere"></div><div id="pnList" style="margin-top:10px"><p class="muted small" style="margin:0">Loading…</p></div></div>';
  devSec.appendChild(box);
  var here = $('#pnHere', box), state = { list: [] };
  var drawHere = function () {
    var mine = state.list.filter(function (x) { return x.current; })[0];
    if (!pnInApp()) { here.innerHTML = '<p class="hint" style="margin:0">To turn notifications on, open Order Studio on your iPhone from its <b>Home Screen icon</b> and come to this screen there.</p>'; return; }
    if (!osPushReady()) { here.innerHTML = '<p class="hint" style="margin:0">Notifications need the app opened from its <b>Home Screen icon</b> (iPhone with iOS 16.4 or newer). Safari tabs can\'t get them.</p>'; return; }
    if (Notification.permission === 'denied') { here.innerHTML = '<p class="hint" style="margin:0">Notifications are blocked for this app. Turn them on in iPhone <b>Settings → Notifications → Order Studio</b>, then come back here.</p>'; return; }
    here.innerHTML = mine ? '<p style="margin:0"><span class="chip green">On for this phone</span></p>'
      : '<button class="btn btn-primary btn-sm" type="button" id="pnOn">' + ico('bell') + 'Turn on notifications on this phone</button>';
  };
  var drawList = function (list) {
    state.list = Array.isArray(list) ? list : []; drawHere();
    var el = $('#pnList', box);
    el.innerHTML = state.list.length ? '<div class="list">' + state.list.map(function (x) {
      return '<div class="list-row"><div class="grow"><div class="title">' + esc(x.name) + (x.current ? ' <span class="chip green">This device</span>' : '') + '</div>' +
        '<div class="sub">Notifications on since ' + esc(devWhen(x.added)) + (x.lastSent ? ' · last sent ' + esc(devWhen(x.lastSent)) : '') + '</div></div>' +
        '<button class="btn btn-secondary btn-sm" type="button" data-pnoff="' + esc(x.id) + '">Turn off</button></div>';
    }).join('') + '</div><div style="margin-top:10px"><button class="btn btn-secondary btn-sm" type="button" id="pnTest">' + ico('bell') + 'Send test notification</button></div>'
      : '<p class="muted small" style="margin:0">No phone has notifications on yet.</p>';
  };
  call('pushList').then(drawList).catch(function () { $('#pnList', box).innerHTML = ''; drawHere(); });
  box.addEventListener('click', function (e) {
    var on = e.target.closest('#pnOn'), off = e.target.closest('[data-pnoff]'), test = e.target.closest('#pnTest');
    if (on) {
      busy(on, 'Turning on…');
      Notification.requestPermission().then(function (perm) {   // asked first, straight from the tap (iPhone needs that)
        if (perm !== 'granted') throw new Error(perm === 'denied' ? 'Notifications weren\'t allowed. You can turn them on in iPhone Settings → Notifications → Order Studio.' : 'Notifications weren\'t turned on.');
        return navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; });
      }).then(function (reg) {
        return call('pushVapidKey').then(function (k) {
          return reg.pushManager.getSubscription().then(function (sub) { return sub || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: pnKeyBytes(k) }); });
        });
      }).then(function (sub) {
        osPushSync();
        return call('pushSubscribe', JSON.parse(JSON.stringify(sub)));
      }).then(function (list) { drawList(list); toast('Notifications are on for this phone'); })
        .catch(function (err) { unbusy(on); fail(err); });
      return;
    }
    if (off) {
      if (!confirm('Turn off notifications for this device?')) return;
      var id = off.getAttribute('data-pnoff'), mine = state.list.filter(function (x) { return x.id === id && x.current; })[0];
      busy(off, '…');
      call('pushUnsubscribe', id).then(function (list) {
        drawList(list); toast('Notifications turned off');
        if (mine && pnInApp() && osPushReady()) navigator.serviceWorker.getRegistration().then(function (r) { return r && r.pushManager.getSubscription(); }).then(function (s) { if (s) s.unsubscribe(); }).catch(function () {});
      }).catch(fail);
      return;
    }
    if (test) {
      busy(test, 'Sending…');
      call('pushTest').then(function (r) {
        unbusy(test);
        toast(r.sent ? 'Test sent to ' + r.sent + (r.sent === 1 ? ' phone' : ' phones') + '. It should arrive in a few seconds.' : 'The test couldn\'t be delivered. Try turning notifications off and on again on your phone.', !r.sent);
        call('pushList').then(drawList).catch(function () {});
      }).catch(function (err) { unbusy(test); fail(err); });
    }
  });
}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
/* ================================================================
   Share my order form: copy link, share sheet, text, email,
   Facebook, Messenger, and a QR code for craft fairs.
   ================================================================ */
Object.assign(ICONS, { share: '<path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>' });
var SHARE_MSG_DEFAULT = 'Hi! You can order a custom, handmade gift from Crafty Rose Gifts here. Pick your item, tell me how to personalize it, and I\'ll send you a proof before you pay 🌹';
function shareMsg() { try { return localStorage.getItem('os.shareMsg') || SHARE_MSG_DEFAULT; } catch (e) { return SHARE_MSG_DEFAULT; } }
function isPhone() { return /iPhone|iPad|Android/i.test(navigator.userAgent); }
function qrDataUrl(text) {
  if (typeof qrcode !== 'function') return '';
  var q = qrcode(0, 'M'); q.addData(text); q.make();
  var n = q.getModuleCount(), s = 8, pad = 4, size = (n + pad * 2) * s;
  var c = document.createElement('canvas'); c.width = c.height = size;
  var x = c.getContext('2d'); x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, size, size); x.fillStyle = '#2F473C';
  for (var r = 0; r < n; r++) for (var k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect((k + pad) * s, (r + pad) * s, s, s);
  return c.toDataURL('image/png');
}
function openShareForm() {
  var url = FORM_URL, msg = shareMsg();
  var scrim = document.getElementById('shScrim'), box = document.getElementById('shBox');
  if (!scrim) {
    scrim = document.createElement('div'); scrim.className = 'sh-scrim'; scrim.id = 'shScrim'; document.body.appendChild(scrim);
    box = document.createElement('div'); box.className = 'sh'; box.id = 'shBox'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', 'Share your order form'); document.body.appendChild(box);
    scrim.addEventListener('click', closeShareForm);
    box.addEventListener('click', function (e) {
      if (e.target.closest('[data-shclose]')) { closeShareForm(); return; }
      if (e.target.closest('#shCopy')) { copyText(FORM_URL, 'Order form link copied'); return; }
      if (e.target.closest('#shCopyMsg')) { copyText(currentMsg() + '\n' + FORM_URL, 'Message and link copied'); return; }
      if (e.target.closest('#shNative')) {
        navigator.share({ title: 'Crafty Rose Gifts order form', text: currentMsg(), url: FORM_URL }).catch(function () {});
        return;
      }
      if (e.target.closest('#shReset')) { $('#shMsg').value = SHARE_MSG_DEFAULT; saveMsg(); refreshLinks(); }
    });
    box.addEventListener('input', function (e) { if (e.target.id === 'shMsg') { saveMsg(); refreshLinks(); } });
  }
  var qr = qrDataUrl(url);
  var canShare = !!navigator.share;
  box.innerHTML = '<div class="sh-head"><h3>Share your order form</h3><button class="icon-btn" type="button" data-shclose aria-label="Close">' + icon('x') + '</button></div>' +
    '<div class="sh-link"><span>' + esc(url.replace('https://', '')) + '</span><button class="btn btn-primary btn-sm" type="button" id="shCopy">' + ico('link') + 'Copy link</button></div>' +
    '<div class="sh-grid">' +
      (canShare ? '<button class="sh-opt" type="button" id="shNative"><b>📤</b>Share…</button>' : '') +
      '<a class="sh-opt" id="shSms" target="_top"><b>💬</b>Text message</a>' +
      '<a class="sh-opt" id="shMail" target="_top"><b>✉️</b>Email</a>' +
      '<a class="sh-opt" id="shFb" target="_blank" rel="noopener"><b>📘</b>Facebook post</a>' +
      (isPhone() ? '<a class="sh-opt" id="shMsgr" target="_top"><b>💭</b>Messenger</a>' : '') +
      '<button class="sh-opt" type="button" id="shCopyMsg"><b>📋</b>Copy message</button>' +
    '</div>' +
    '<div class="sh-label">Message that goes with the link</div>' +
    '<textarea class="input sh-msg" id="shMsg">' + esc(msg) + '</textarea>' +
    '<div style="text-align:right;margin-top:4px"><button class="link-btn" type="button" id="shReset">Reset message</button></div>' +
    '<p class="hint" style="margin:6px 0 0">For Instagram, tap <b>Copy link</b> and paste it into your bio, a story link sticker, or a DM.</p>' +
    (qr ? '<div class="sh-label">QR code for craft fairs & packaging</div><div class="sh-qr"><img src="' + qr + '" alt="QR code for your order form" id="shQrImg"><div>' +
      '<p>Customers point their phone camera at it to open your order form. Print it for your table, cards or packaging.</p>' +
      '<a class="btn btn-secondary btn-sm" download="crafty-rose-order-form-qr.png" href="' + qr + '" target="_blank">Save QR code</a>' +
      (isPhone() ? '<p class="hint" style="margin:8px 0 0">Or press and hold the code to save it to Photos.</p>' : '') + '</div></div>' : '') +
    '<div class="sh-done"><button class="btn btn-primary" type="button" data-shclose>Done</button></div>';
  refreshLinks();
  scrim.classList.add('on'); box.classList.add('on');
  var app = document.getElementById('app'); if (app) app.classList.remove('nav-open');
}
function currentMsg() { var m = document.getElementById('shMsg'); return (m && m.value.trim()) || SHARE_MSG_DEFAULT; }
function saveMsg() { try { localStorage.setItem('os.shareMsg', currentMsg()); } catch (e) {} }
function refreshLinks() {
  var m = currentMsg(), u = FORM_URL, full = m + '\n' + u;
  var set = function (id, href) { var a = document.getElementById(id); if (a) a.href = href; };
  set('shSms', 'sms:' + (/iPhone|iPad/.test(navigator.userAgent) ? '&' : '?') + 'body=' + encodeURIComponent(full));
  set('shMail', 'mailto:?subject=' + encodeURIComponent('Order a custom gift from Crafty Rose Gifts') + '&body=' + encodeURIComponent(full));
  set('shFb', 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(u));
  set('shMsgr', 'fb-messenger://share/?link=' + encodeURIComponent(u));
}
function closeShareForm() { var s = document.getElementById('shScrim'), b = document.getElementById('shBox'); if (s) s.classList.remove('on'); if (b) b.classList.remove('on'); }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeShareForm(); });

/* Buttons: in the side menu, on the dashboard, and in Invoice settings */
document.addEventListener('DOMContentLoaded', function () {
  var foot = document.querySelector('.sidebar-foot');

var _greetingShare = greetingHtml;
greetingHtml = function () {

};
document.addEventListener('click', function (e) { if (e.target.closest('[data-act-share]')) openShareForm(); });
var _openInvoiceSettingsS = openInvoiceSettings;
openInvoiceSettings = function (backToOrder) {
